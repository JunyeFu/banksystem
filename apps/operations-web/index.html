<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营审核台</title><link rel="stylesheet" href="styles.css"></head>
<body><main><p class="eyebrow">BANK OPERATIONS</p><h1>运营审核台</h1><p class="muted">内部操作员视图：审核队列、清算状态与对账差异。</p><section class="grid"><article><h2>待审核</h2><p class="metric" id="review-count">—</p><p class="muted">需要 Maker-Checker 复核</p><button data-action="refresh">刷新队列</button></article><article><h2>清算状态</h2><p class="metric" id="clearing-status">READY</p><p class="muted">重复和乱序回调受 Inbox 保护</p></article><article><h2>对账差异</h2><p class="metric" id="recon-status">MATCHED</p><p class="muted">渠道与核心 reference 对齐</p></article></section><section class="card"><h2>审批约束</h2><ul><li>审批必须提供理由。</li><li>Maker 与 Checker 不得是同一主体。</li><li>审批请求必须携带当前 version。</li></ul><p id="status" role="status">页面已加载；请通过受保护 Operations API 操作。</p></section></main><script src="app.js"></script></body></html>
