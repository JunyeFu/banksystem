server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    absolute_redirect off;

    location /ops/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ops/index.html;
    }

    location = / {
        return 302 /ops/;
    }

    location = /ops {
        return 302 /ops/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
