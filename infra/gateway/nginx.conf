events {}
http {
  access_log off;
  upstream channel_service { server channel-service:8080; }
  upstream customer_web { server customer-web:80; }
  server {
    listen 8080;
    location = /health {
      default_type application/json;
      return 200 '{"status":"UP","service":"gateway"}';
    }
    location = /internal/health {
      proxy_pass http://channel_service;
      proxy_set_header Host $host;
    }
    location /internal/transfers/ {
      proxy_pass http://channel_service;
      proxy_set_header Host $host;
    }
    location / {
      proxy_pass http://customer_web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      proxy_pass http://channel_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
