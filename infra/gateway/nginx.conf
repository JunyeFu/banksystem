events {}
http {
  access_log off;

  upstream bank_channel_service { server bank-channel-service:8080; }

  server {
    listen 8080;

    location = /health {
      default_type application/json;
      return 200 '{"status":"UP","service":"gateway"}';
    }

    location = /internal/health {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/transfers/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/mock-clearing/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location = /internal/monitoring/alerts {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/eod/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/reconciliation/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/test-support/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
