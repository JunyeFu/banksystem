events {}
http {
  access_log off;

  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream bank_channel_service {
    zone bank_channel_service 64k;
    server bank-channel-service:8080 resolve;
  }
  upstream test_support_service {
    zone test_support_service 64k;
    server test-support-service:8080 resolve;
  }

  server {
    listen 8080;

    location = /health {
      default_type application/json;
      return 200 '{"status":"UP","service":"gateway"}';
    }

    location = /internal/health {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/transfers/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/mock-clearing/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location = /internal/monitoring/alerts {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/eod/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/reconciliation/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
    }

    location /internal/test-support/ {
      proxy_pass http://test_support_service;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://bank_channel_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
