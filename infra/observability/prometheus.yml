global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: bank-channel-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['bank-channel-service:8080']
        labels:
          service: bank-channel-service

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
