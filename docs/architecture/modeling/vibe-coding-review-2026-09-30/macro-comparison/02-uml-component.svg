<text text-anchor="start" x="37" y="824" font-size="16" font-weight="400"><tspan x="37" dy="0">组件符号表示逻辑职责；内部框为渠道容器；底部 PostgreSQL / Fineract 是外部资源。具体模块耦合见 DSM。</tspan></text>
<text text-anchor="start" x="37" y="861" font-size="16" font-weight="400"><tspan x="37" dy="0">目标要求责任分离；并不要求每一个只读投影增加应用服务，也不禁止合法的跨模块协调。</tspan></text>
