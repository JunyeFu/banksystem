<svg xmlns="http://www.w3.org/2000/svg" width="770" height="680" viewBox="0 0 770 680"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66758a"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#26364c} .label{font-size:12px} .edge{font-size:10px;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style><text x="40" y="43" font-size="20" font-weight="700">理想领域关系：申请、业务订单与核心事实分离</text>
