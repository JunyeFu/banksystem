  recoveryPoint: 872ef54 + RF-005 baseline；git 恢复旧代码 + 受管重启（硬回退）
  maxRtoMinutes: 30
  maxRpoMinutes: 0

exclusions: 任何新功能/代码变更；重构全景关闭后的后续规划（如命名收口/DSL 扩展）需新立项

risks:
