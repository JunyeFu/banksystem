    - 任何别名投影导致Flowise可见输出变化或Harness载荷出现非权威字段
    - 影子观测发起第二次请求（静态断言失败）
    - ReleaseIdentity或18/18发生非预期变化
    - 修改越出 allowedPaths
  recoveryPoint: dacd79580ec73f3580594ab2134acf8cc3d99f35 + RF-001 baseline + 回滚本切片文件（mcp/src + 测试 + 文档）
  maxRtoMinutes: 30
  maxRpoMinutes: 0

# 明确排除（后续切片，不在本切片）
exclusions:
  - candidate_decide / schedule_disable 前置读 requestHarness 观测接入（B3-S4，直接编排工具观测收尾）
  - 隔离运行态 HENGZHUN_RF001_SHADOW=1 真实流量影子与零重复写入证明（B3-S5，申请 SHADOW_VERIFIED 的硬门禁）
  - 公共API实时回读刷新（B3-S5 前置，本切片保持 CONTRACT 级证据）
  - 切流、错误信封切换、B4 兼容/回滚验证
  - RF-002

risks:
  - authoring_submit 决策若为 OPTION-B 需拆批；若审计发现现有 Flowise 流依赖别名，S3-1 输出将决定走 OPTION-A 并在决策日志记录断点
  - case_prepare 三个草案来源"必须且只能一个"的既有约束不得被投影破坏（draftArray/draftJson 同时出现时必须仍报错）
  - journey_prepare 未解析模板窄兼容与 draftJson 投影叠加时保持允许模式不变
  - 证据新鲜度：本切片只产出 CONTRACT 级证据；公开API回读仍为缓存且过期，不作为本切片通过依据
