# 单业务目标：把B2冻结合同(mcp-boundary-contract-v1.json)登记的13项入口别名，在MCP入口逐项投影为权威字段，
# 保持旧字段可读、Harness请求载荷只含权威字段、Flowise收到的旧输出形状不变。
# 单功能点：MCP入口别名→权威请求投影（含每项别名的样本测试）。不跨切片。
businessGoal:
  - 13/13别名在 mcp/src/rf001-contract-adapter.cjs 拥有确定性权威投影函数（canonicalRequest projection）
  - 每项别名至少一个样本测试：输入别名 → 断言Harness载荷形状与字段、确定性、与旧字段兼容
  - Flowise可见输出与错误形状不变（旧投影继续生效），HENGZHUN_RF001_SHADOW=1 仅开启比较，永不发起第二次请求
  - authoring_submit 七组数组字段完成 reject-or-wire 决策并经用户批准，决策结果登记回B2合同（不改13别名计数）
  - ReleaseIdentity 与 18/18 验收基线不变
functionalPoint: MCP入口别名规范化为权威请求字段（8个工具、13个别名项）
evidenceLevel: CONTRACT

# 别名清单（来自 mcp-boundary-contract-v1.json，本切片冻结，不得增删条目）
aliasInventory:
  - tool: ingest_submit
    alias: supportingImageIngestId=NONE
    canonical: supportingImageIngestId omitted
    adapter: COMPAT-EMPTY-TO-UNDEFINED
  - tool: ingest_decision_submit
    alias: correctionsJson
    canonical: corrections
    adapter: COMPAT-JSON-ARRAY-STRING
  - tool: ingest_decision_submit
    alias: itemDecisionsJson
    canonical: itemDecisions
    adapter: COMPAT-JSON-ARRAY-STRING
  - tool: journey_prepare
    alias: draftJson
    canonical: draftJson
    adapter: COMPAT-JSON-OBJECT-STRING
    decision: 合同自映射修正（2026-08-02批准）：Harness可执行Schema权威名即draftJson，不投影、不改名
  - tool: case_prepare
    alias: draftArray
    canonical: draft
    adapter: COMPAT-JSON-ARRAY-STRING
  - tool: case_prepare
    alias: draftJson
    canonical: draft
    adapter: COMPAT-JSON-OBJECT-STRING
  - tool: case_prepare
    alias: acceptanceSummaryJson
    canonical: acceptanceSummary
    adapter: COMPAT-JSON-OBJECT-STRING
  - tool: case_prepare
    alias: multimodalContextJson
    canonical: multimodalContext
    adapter: COMPAT-JSON-OBJECT-STRING
  - tool: authoring_submit
    alias: intentStepIds/actions/expectedOutcomes/riskLevels/inputValues/inputValueSources/assertions (7组数组字段)
    canonical: no canonical effect
    adapter: COMPAT-JSON-OBJECT-STRING + COMPAT-INTEGER-STRING + COMPAT-EMPTY-TO-UNDEFINED
    decision: OPTION-C 登记无效果（2026-08-02批准）：v5+零消费者，保持行为不变，静态断言不进入Harness载荷
  - tool: run_submit
    alias: implicit credentialAlias=i3-customer
    canonical: execution credential binding (B4 credentialRef迁移前冻结)
    adapter: none
  - tool: schedule_create
    alias: implicit credentialAlias=i3-customer
    canonical: execution credential binding (B4 credentialRef迁移前冻结)
    adapter: COMPAT-EMPTY-TO-UNDEFINED + COMPAT-INTEGER-STRING
  - tool: repair_propose
    alias: patchJson
    canonical: patch
    adapter: COMPAT-JSON-OBJECT-STRING
  - tool: repair_propose
    alias: operationType/targetRef/locatorKind/locatorValue/rationale (5平铺字段)
    canonical: patch
    adapter: COMPAT-EMPTY-TO-UNDEFINED

