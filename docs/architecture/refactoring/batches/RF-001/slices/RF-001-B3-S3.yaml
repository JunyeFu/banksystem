forbiddenPaths:
  - platform/hengzhun-regression-system/harness/**           # Harness Schema不接收别名；本切片不改Harness
  - platform/hengzhun-regression-system/flowise/**           # 批次级禁止
  - platform/hengzhun-regression-system/worker/**            # 批次级禁止
  - platform/hengzhun-regression-system/contracts/**         # 公开合同不在本切片变更（批次预算 maxContractsChanged 留给B4前只动RF-001合同）
  - apps/**, services/**, infra/**, data/**, .data/**, secrets/**, .env
  - agent/backlog.yaml, agent/plans/active/v54-implementation-batches.md   # 状态变更由用户在批层批准，不在切片内
