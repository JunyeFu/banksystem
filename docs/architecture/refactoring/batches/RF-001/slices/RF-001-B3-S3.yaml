budgets:
  maxChangedFiles: 8
  maxNewFiles: 2
  maxChangedLines: 800
  maxContractsChanged: 1        # 仅 mcp-boundary-contract-v1.json 状态/决策字段
  maxMigrationsAdded: 0
  maxOpenModules: 1             # 仅 hengzhun.mcp
  runtimeCutover: false         # 本切片不切流、不重启MCP、不启用正式流量影子

# 不可变不变量（测试与静态校验共同强制）
invariants:
  - 旧工具输出保持不变；别名读取只发生在MCP入口
  - Harness请求载荷只含权威字段；authoring_submit 7组数组字段在决策落地前不得进入Harness载荷
  - 影子永不发起第二次请求（每工具往返恰好一次 requestHarness）
  - 条件写工具单请求单副作用（schedule_get/candidate_get/result_inbox_list 静态断言保持）
  - 不改SQLite结构、不新增迁移、不改变运行状态机
  - 不读取、不记录、不输出任何密钥与凭据原文（投影记录只含字段形状与SHA-256摘要）

# 决策记录（2026-08-02 用户授权按合同+实情裁定）
decisions:
  - id: DEC-1
    subject: authoring_submit 7组数组字段
    outcome: OPTION-C 登记无效果
    rationale: v5/v6/v7 Flowise制品零消费者（v2/v3/v4历史制品曾绑定、已被取代）；OPTION-B接线改变运行语义超出批次约束需拆批；OPTION-A显式拒绝在零消费者场景引入无谓行为差异。标准做法：行为不变、显式登记、测试锁定（静态断言7组字段永不进入Harness载荷）。合同"until"字段更新为决策记录，13别名计数不变。
  - id: DEC-2
    subject: journey_prepare draftJson 合同修正
    outcome: 自映射修正（alias=draftJson → canonical=draftJson）
    rationale: Harness可执行Schema（i10/schemas.ts L430 draftJson:z.record）与service.ts（L1357/1621 I10_DRAFT_REQUIRED/1727）权威字段名即draftJson，MCP现行即发送draftJson；B2合同冻结canonical=draft与可执行真相冲突，按"契约跟随可执行边界、语义冻结"标准修正为自映射。validate_rf001_contract.py仅要求alias/canonical/until三键存在，13计数不变。case_prepare的draftJson→draft维持（i10 cases:prepare权威名确认为draft，schemas.ts L364）。

# 工作步骤（执行顺序固定，S3-1/S3-2已完成）
workSteps:
  - step: S3-1 消费者审计（已完成）
    action: 只读检索 flowise/i10 agentflow-v5/v6/v7 的工具调用参数。结果：6项别名有真实调用点（case_prepare.draftJson×2、journey_prepare.draftJson×4、ingest_decision_submit.correctionsJson/itemDecisionsJson×4、repair_propose.patchJson×1、ingest_submit.supportingImageIngestId=NONE×2）；7项无消费者（case_prepare.draftArray/acceptanceSummaryJson/multimodalContextJson、repair_propose 5平铺字段、authoring_submit 7组数组字段、run_submit/schedule_create隐式credentialAlias）。
    evidence: docs/architecture/refactoring/batches/RF-001/decision-log.md 条目21
  - step: S3-2 决策门禁（已完成）
    action: DEC-1=OPTION-C、DEC-2=合同自映射修正，已按用户授权裁定并记录（见decisions节）。B2合同"until"字段回写决策结果（不改13计数）。
    evidence: docs/architecture/refactoring/batches/RF-001/decision-log.md 条目21
  - step: S3-3 适配器实现（已完成）
    action: 在 rf001-contract-adapter.cjs 为13项别名各实现确定性权威投影函数；投影输出只含权威字段，secret 字段只记录形状与SHA-256摘要；移入 parseJsonArgument/normalizeCasePrepareUrl/CredentialRef/ActionSteps/normalizeI10NaturalDraft（先经独立沙箱语义对照PASS后删除本地137行副本）
  - step: S3-4 工具入口接线（已完成）
    action: server.cjs 8个工具入口调用投影函数；journey_prepare 保持发送 draftJson（DEC-2自映射）；run_submit/schedule_create 凭证绑定 i3-customer 冻结不变；7组数组字段由 normalizeAuthoringSubmitRequest 显式剥离（DEC-1）
  - step: S3-5 样本测试（已完成）
    action: 新增 rf001-b3s3-aliases.test.cjs：13项别名每项样本+无效果断言+自映射回归+无IO静态断言+接线断言；聚焦测试29/29通过
  - step: S3-6 验证与证据（已完成）
    action: 聚焦测试、validate_refactoring.py、validate_rf001_contract.py、validate_docs.py、git diff --check 全过；身份对照受限复算（inspect-i10.ps1缺失，sourceFlowHash重算一致，identityHash不变）；shadow-implementation-report.md / evidence-index.md / decision-log.md 已更新
  - step: S3-7 逐级向上同步（已完成，RC-D1）
    action: 任务包→本切片（完成标记）→batch.yaml（预算消耗记录于决策日志条目23，无范围变化）→v54实施顺序（B3条目更新）；DEC-2合同自映射为唯一合同事实修正，已回写合同与决策日志
    evidence: docs/architecture/refactoring/batches/RF-001/decision-log.md

