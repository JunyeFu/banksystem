  - candidate_decide/schedule_disable 错误路径错误码不变（I8_CANDIDATE_VERSION_UNAVAILABLE / I8_SCHEDULE_STATUS_UNAVAILABLE）
  - 不读取、不记录、不输出任何密钥与凭据

