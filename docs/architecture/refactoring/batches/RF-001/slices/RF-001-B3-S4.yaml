# 单业务目标：完成直接编排工具的观测覆盖收尾——candidate_decide 与 schedule_disable
# 的前置读 requestHarness 调用迁移到 shadowedRequest 工具级观测，使全部 10 个直接编排/
# 复合工具（B3-S2 的 8 个 + 本切片 2 个）的每个 Harness 往返恰好观测一次。
# 单功能点：2 个工具的前置读观测接线 + 观测覆盖静态断言。不跨切片。
businessGoal:
  - candidate_decide 前置读 `/v1/i8/candidates:get` 经 `shadowedRequest('candidate_decide', ...)` 观测
  - schedule_disable 前置读 `/v1/i8/schedules:get` 经 `shadowedRequest('schedule_disable', ...)` 观测
  - 两个工具的写路径继续走已观测的 `callHarness`，载荷与错误码逐字节不变
  - 静态断言：两个工具块不再含裸 `requestHarness(`；ORCHESTRATION_TOOLS 覆盖 10 个工具
  - ReleaseIdentity 与 18/18 验收基线不变
functionalPoint: 直接编排工具前置读的 shadowedRequest 观测接线（2 工具）
evidenceLevel: CONTRACT

# 现状事实（B3-S2 遗留项，登记于 shadow-implementation-report.md 与 decision-log.md 条目20）
currentState:
  - tool: candidate_decide
    preRead: requestHarness('/v1/i8/candidates:get', { namespace, preparationId })   # 未观测
    write: callHarness('/v1/i8/candidates:decide', ...)                              # 已观测（shadowOperation=route）
  - tool: schedule_disable
    preRead: requestHarness('/v1/i8/schedules:get', { namespace, scheduleId })       # 未观测
    write: callHarness('/v1/plugin/schedules:disable', ...)                          # 已观测（shadowOperation=route）
  - 已观测直接编排工具（B3-S2）：candidate_get/candidate_preview/task_get/schedule_get/result_inbox_list/failure_get/repair_propose/decision_submit

# 允许路径（收窄于批次 includePaths）
