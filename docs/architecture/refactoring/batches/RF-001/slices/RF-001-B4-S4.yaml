# 单业务目标：MCP错误响应从旧投影切换到B2冻结的8字段规范信封，
# 保留 HENGZHUN_RF001_LEGACY_ERROR=1 回退开关；errorCode权威名不变；
# 影子比较切流后继续保留。切流只发生在 hengzhun.mcp 适配器边界。
# 单功能点：错误信封输出切换（+回退开关）。
businessGoal:
  - 适配器新增 projectCanonicalToolError：工具级错误对象投影为规范信封（幂等，兼容validationIssues→fieldErrors）
  - server.cjs：textResult(isError) 默认输出规范信封；HENGZHUN_RF001_LEGACY_ERROR=1 时输出旧形状；callHarness 失败路径输出 canonical（含safeMessage/correlationRef）而非仅legacy
  - 生产MCP重启后实时验证：错误响应为规范信封（retryable/userActionRequired/fieldErrors/safeMessage/correlationRef 等字段），errorCode 保留
  - 回退验证：LEGACY_ERROR=1 下响应为旧形状 {errorCode,category,status}
  - 身份 632ad5ee 不变；影子回归 mismatched=0
functionalPoint: 错误信封输出切换
evidenceLevel: RUNTIME_CUTOVER

allowedPaths:
  - platform/hengzhun-regression-system/mcp/src/rf001-contract-adapter.cjs   # 新增 projectCanonicalToolError
  - platform/hengzhun-regression-system/mcp/src/server.cjs                    # textResult/callHarness + legacyErrorOutput 开关
  - platform/hengzhun-regression-system/scripts/verification/rf001-b4s1-compat-error-baseline.test.cjs   # 切流后基线更新
  - platform/hengzhun-regression-system/scripts/verification/rf001-b4s4-cutover.test.cjs   # 【新增】切流验证（静态+可选实时）
  - docs/architecture/refactoring/batches/RF-001/**（decision-log/evidence-index/shadow-report/slices）
  - 生产MCP进程重启（i9-lifecycle.cjs 受管命令）与实时探测（用户已批准切流）

