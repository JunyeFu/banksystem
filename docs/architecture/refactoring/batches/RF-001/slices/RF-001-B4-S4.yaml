workSteps:
  - step: S4-1 适配器投影
    action: rf001-contract-adapter.cjs 新增 projectCanonicalToolError（幂等规范信封；validationIssues→fieldErrors 兼容；safeMessage/correlationRef 有界截断）并导出
  - step: S4-2 server.cjs 切换
    action: import + `const legacyErrorOutput = process.env.HENGZHUN_RF001_LEGACY_ERROR === '1'`；textResult(isError) 非legacy时投影规范信封；callHarness 失败路径输出 canonical（legacy 分支保留）
  - step: S4-3 测试更新
    action: B4-S1 切流前基线测试更新为切流后基线（开关存在且默认关闭、旧投影保留于回退路径）；新增 rf001-b4s4-cutover.test.cjs（静态断言 + 投影函数单测）
  - step: S4-4 隔离回归
    action: 全聚焦测试（含B3-S5隔离运行态回归39项）全绿
  - step: S4-5 生产切流与实时验证
    action: i9-lifecycle.cjs 受管重启生产MCP → 实时错误路径探测（task_get 404）断言规范信封字段 → LEGACY_ERROR=1 重启探测旧形状 → 切回默认重启 → 影子快照/身份确认
  - step: S4-6 证据与同步
    action: 更新报告/证据索引/决策日志；RC-D1逐级同步；cutover-runbook 切流记录

