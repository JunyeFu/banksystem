# 单业务目标：切流后观察窗口（生产错误信封完整、全量回归、身份/18链无回退），
# 然后批次关闭（batch.yaml IMPLEMENTING→CLOSED）、RF-002 解禁登记、runbook 状态收口。
# 单功能点：观察与关闭。
businessGoal:
  - 生产观察：多个错误路径工具实时探测均返回规范信封且 errorCode 保留
  - 全量回归：全聚焦测试 43/43、静态校验×3、git diff --check
  - 身份/18链：identityHash=632ad5ee…、18/18
  - batch.yaml status → CLOSED（校验器 PASS）；cutover/rollback runbook 状态收口；RF-002 解禁登记
functionalPoint: 切流后观察与批次关闭
evidenceLevel: RUNTIME_OBSERVE

allowedPaths:
  - docs/architecture/refactoring/batches/RF-001/batch.yaml（status → CLOSED）
  - docs/architecture/refactoring/batches/RF-001/cutover-runbook.md（切流记录收口）
  - docs/architecture/refactoring/batches/RF-001/rollback-runbook.md（演练记录收口）
  - docs/architecture/refactoring/batches/RF-001/decision-log.md
  - docs/architecture/refactoring/batches/RF-001/evidence-index.md
  - docs/architecture/refactoring/batches/RF-001/shadow-implementation-report.md
  - docs/architecture/refactoring/batches/RF-001/slices/**
  - 生产环境只读探测（不重启、不写入）

forbiddenPaths:
  - mcp/harness/flowise/worker/contracts/apps/services 源码零改动；生产DB不写
  - agent/backlog.yaml, agent/plans/active/v54-implementation-batches.md（批层状态由用户在批层批准——本切片经用户批准后同步）
  - scripts/architecture/**；SQLite迁移

budgets:
  maxChangedFiles: 8
  maxNewFiles: 0
  maxChangedLines: 150
  maxContractsChanged: 0
  maxMigrationsAdded: 0
  maxOpenModules: 0

invariants:
  - 观察只读；不重启生产服务；不伪造观察证据
  - 关闭前全量验证必须全绿；任何失败则批次保持 IMPLEMENTING 并如实记录
  - 密钥不输出

workSteps:
  - step: S5-1 生产观察
    action: 实时探测多个错误路径工具（task_get/schedule_get/candidate_get/candidate_decide/run_submit 等404路径）→ 规范信封字段完整 + errorCode 保留；四服务健康
  - step: S5-2 全量回归
    action: 全聚焦测试43/43、静态校验×3、git diff --check、身份复算、18链账本
  - step: S5-3 批次关闭
    action: batch.yaml status IMPLEMENTING→CLOSED（validate_refactoring.py PASS）；cutover-runbook（切流已执行）、rollback-runbook（演练已完成）状态收口；RF-002 解禁登记
  - step: S5-4 证据与同步
    action: 更新报告/证据索引/决策日志；RC-D1逐级同步（任务包→切片→batch→v54）

verification:
  requiredCommands:
    - name: observe-probes
      command: 生产MCP多错误路径探测（curl/脚本）
      expectedExitCode: 0
      expectedOutput: 全部规范信封 + errorCode保留
      blocking: true
    - name: rf001-focused-tests
      command: runtime/node-v20.20.2-win-x64/node.exe --test scripts/verification/*.cjs（rf001聚焦7文件）
      expectedExitCode: 0
      expectedOutput: 43 passed / 0 failed
      blocking: true
    - name: refactoring-contracts / rf001-mcp-boundary-contract / documentation
      command: python scripts/architecture/validate_refactoring.py && python scripts/architecture/validate_rf001_contract.py && python scripts/docs/validate_docs.py
      expectedExitCode: 0
      expectedOutput: 三者PASS（含 batch CLOSED 状态校验）
      blocking: true
    - name: runtime-release-identity / 18chain
      command: i10-release-identity.cjs + i10-18-chain-acceptance-live.cjs status
      expectedExitCode: 0
      expectedOutput: identityHash=632ad5ee…、18/18
      blocking: true

rollback:
  triggerConditions: 观察或回归任何失败——批次保持IMPLEMENTING并如实记录
  recoveryPoint: batch.yaml status 回退 IMPLEMENTING；生产默认规范信封可由 LEGACY_ERROR=1 软回退
  maxRtoMinutes: 15
  maxRpoMinutes: 0

exclusions: RF-002（解禁登记仅记录，不启动）；任何新适配/代码变更
