rollback:
  triggerConditions:
    - 计数代理显示任何重复写入（route计数>调用数）
    - 影子mismatched>0或observed!=往返数
    - ReleaseIdentity复算不一致；生产DB/进程被触碰
    - 越出 allowedPaths
  recoveryPoint: dacd795 + RF-001 baseline；运行态产物可整体删除重建
  maxRtoMinutes: 30
  maxRpoMinutes: 0

# 明确排除
exclusions:
  - 切流（错误信封切换、旧投影退役）——B4
  - 正式Flowise对话/18链重跑——B4 及之后
  - 生产流量影子（本切片只允许隔离运行态）
  - 适配器/合同/测试文件的新增投影变更
  - RF-002

risks:
  - 公共API回读依赖正式Flowise与模型密钥环境；不可用时只登记残余风险，不冒充新鲜证据（SHADOW_VERIFIED申请口径随证据等级如实声明）
  - 隔离DB副本若含运行态脏数据可能导致个别404/错误路径形状与预期偏差：矩阵断言只锁定"往返数+零重复+零mismatch"，不断言业务成功（成功路径仅 credential_session_* 与 case_prepare 明确断言）
  - 端口冲突/残留进程：预检+finally清理+启动失败即失败关闭
