  maxNewFiles: 2
  maxChangedLines: 500
  maxContractsChanged: 0
  maxMigrationsAdded: 0
  maxOpenModules: 1             # 代码零改动；运行时使用 hengzhun.mcp + hengzhun.harness
  runtimeIsolation: true        # 全部运行态产物在 .data/tests/rf001-shadow/，隔离端口 28887/28889，用完停止并清理

# 不可变不变量
invariants:
  - 零重复写入：计数代理按route统计POST数 == 工具调用数（含多往返工具按往返计数）
  - 影子观测：stderr事件 observed==预期往返数、mismatched==0；事件只含操作名/字段形状/摘要，无凭据/请求体
  - 隔离性：不写生产DB、不碰生产进程、不读生产Token（临时随机Token仅注入隔离进程）
  - 完成后进程全部停止、隔离目录清理；测试可重复执行
  - ReleaseIdentity 复算一致；18/18 账本不重跑（B4门禁）

# 工作步骤（执行顺序固定）
workSteps:
  - step: S5-1 预检
    action: 校验 dist/harness/src/index.js 存在、.data/flowise/app 存在、端口28887/28889空闲；生成临时随机Token（≥32 hex，不读生产环境）
  - step: S5-2 隔离运行态编排
    action: 新建 .data/tests/rf001-shadow/；SQLite备份API复制生产DB→隔离副本（或空库由Harness自动迁移，二选一并在报告记录）；启动计数代理（http代理→28887，按route计数）；启动隔离Harness（dist，PORT=28887，隔离DB）；启动隔离MCP（PORT=28889，HENGZHUN_RF001_SHADOW=1，HENGZHUN_HARNESS_URL=计数代理）
  - step: S5-3 流量矩阵
    action: 经MCP JSON-RPC驱动确定性流量：credential_session_create×3（幂等，成功写）、credential_session_get×3（成功读）、case_prepare×1（i8路由，验收别名投影真实流量）、task_get/schedule_get/candidate_get/candidate_decide/schedule_disable/repair_propose/decision_submit/failure_get/run_submit/authoring_submit/ingest_submit各1（404/错误路径）、verification_get×1（MCP级错误，0往返）；预期≥20次往返
  - step: S5-4 断言与证据
    action: 计数代理route计数==预期；影子stderr observed==往返数、mismatched==0、无凭据泄漏；响应形状符合旧投影；写命令、退出码、往返明细入报告
  - step: S5-5 身份与新鲜度收口
    action: node scripts/i10-release-identity.cjs 复算identityHash并与基线632ad5ee…对照；公共API实时回读：若正式Flowise运行环境可用（含模型密钥环境），按既有验收脚本刷新部署Hash回读；不可用则记录确切原因+残余风险（切流前置）
  - step: S5-6 清理
    action: 停止隔离MCP/Harness/代理（finally），删除 .data/tests/rf001-shadow/，确认生产进程与端口不受影响
  - step: S5-7 证据与逐级同步（RC-D1）
    action: 更新 shadow-implementation-report.md（RUNTIME_SHADOW小节）/evidence-index.md/decision-log.md；任务包→切片→batch.yaml→v54，无顶层冲突

