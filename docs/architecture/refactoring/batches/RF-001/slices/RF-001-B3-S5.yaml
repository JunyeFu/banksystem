# 单业务目标：在隔离运行态证明 MCP 影子观测零重复写入、旧/新投影在真实流量下零差异，
# 并用产品自有模块完成运行时身份复算；公共API回读新鲜度按环境可用性收口或登记残余风险。
# 单功能点：隔离运行态影子验证（B3-S5）。不跨切片。
businessGoal:
  - 隔离运行态（隔离DB副本+计数代理+HENGZHUN_RF001_SHADOW=1的MCP）驱动确定性流量矩阵（≥20次Harness往返）
  - 计数代理证明：每个工具调用恰有一次Harness请求（零重复写入）；影子观测 observed=往返数、mismatched=0
  - 运行时身份复算：`node scripts/i10-release-identity.cjs` identityHash 与基线 632ad5ee… 一致
  - 公共API实时回读：环境可用则刷新（替代过期缓存证据）；不可用则记录确切原因与残余风险，不冒充
  - 达到证据等级 RUNTIME_SHADOW；切流不在本切片
functionalPoint: 隔离运行态影子验证与身份/新鲜度收口
evidenceLevel: RUNTIME_SHADOW

# 运行态事实（B3-S3/S4 之后现状）
currentState:
  - mcp/src/server.cjs 影子开关: HENGZHUN_RF001_SHADOW=1 启用 createShadowObserver（sink=stderr），默认关闭
  - 10个直接编排/复合工具前置读与写路径全部经 shadowedRequest/callHarness 观测（B3-S2~S4）
  - 13项别名投影已接线（B3-S3）；聚焦测试30/30为CONTRACT级，无运行态证据
  - dist/harness/src/index.js 已编译（dist/ 被gitignore）；生产DB .data/sqlite/regression_platform.sqlite
  - scripts/i10-release-identity.cjs 为文件级身份计算模块（publication-manifest + agentflow-v7 + harness/src/i10/service.ts + worker + migration 36 + case-catalog）
  - inspect-i10.ps1 缺失（batch.yaml命令引用），B3-S3/S4 仅能受限复算；本切片用 i10-release-identity.cjs 关闭该缺口
  - 公共API回读证据 CACHED_EVIDENCE_FILE 且已过新鲜度窗口（登记于 evidence-index.md）

