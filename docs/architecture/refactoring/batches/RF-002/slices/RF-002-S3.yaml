rollback:
  triggerConditions: v7 消费面断裂（output.status/verification.* 形状变化）；展示投影非冻结映射；身份变化
  recoveryPoint: c1ea9fa + RF-002 baseline；回滚 server.cjs 两工具与 gate 扩展
  maxRtoMinutes: 30
  maxRpoMinutes: 0

exclusions: S4（条件写收口）、S5（切流关闭）；flowise/worker/contracts 改动；生产操作

risks:
  - S1 A3/A4 锚点（MCP 硬编码集合存在断言）在 S3 落地后需翻转——更新 rf002-s1 测试
  - 展示投影的 status:'WAITING_USER' 映射需在切片中明确为冻结映射（非推断），并经合同测试锁定
