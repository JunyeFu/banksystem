rollback:
  triggerConditions: 新字段破坏既有消费者（verification:get 双源不一致）；terminal 判定与 nextAction 漂移；身份变化
  recoveryPoint: 5a8e06d + RF-002 baseline；回滚 service.ts 两处增强与测试
  maxRtoMinutes: 30
  maxRpoMinutes: 0

exclusions: S3（MCP 收敛，下一门禁）、S4（条件写收口）、S5（切流关闭）；mcp/flowise/worker/contracts 改动；生产操作

risks:
  - getI8Candidate 返回对象结构大（多表 JOIN），verificationGate 附加需按 job_id 二次查询；S2-2 实现时以只读子查询保持幂等
  - 双源一致性（verificationGate vs verification:get）以同一 SQLite 行为数据源，合同测试同源断言
