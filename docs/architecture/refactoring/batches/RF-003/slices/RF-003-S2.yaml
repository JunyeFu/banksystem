# 单业务目标：版本单一来源——MCP SDK 注册版本与健康接口版本均从运行时合同
# contractVersion（contracts/mcp/hengzhun-i8.json，当前 10.1.0）派生，
# 启动时校验格式失败关闭；三源一致性机器断言。
# 单功能点：版本统一实现（V1/V2/V3）。
businessGoal:
  - V1：server.cjs McpServer 构造 version 由合同 contractVersion 派生（替换硬编码 8.0.0）
  - V2：/health 响应 version 同源（替换硬编码 10.0.0）
  - V3：三源一致性断言（合同 == 健康响应 == SDK 注册来源），启动校验失败关闭（缺版本/格式非法 → HENGZHUN_CONTRACT_VERSION_INVALID 类错误）
  - S1 反转锚点：三源漂移断言 → 三源一致断言（唯一版本 10.1.0）
  - 隔离运行态探测：/health version == 合同值；工具调用正常（行为零变化）
  - 聚焦回归 + 身份 632ad5ee 不变
functionalPoint: 版本统一实现
evidenceLevel: CONTRACT + 隔离运行态验证

allowedPaths:
  - platform/hengzhun-regression-system/mcp/src/server.cjs   # 版本派生（两处）
  - platform/hengzhun-regression-system/scripts/verification/rf003-s2-version-unify.test.cjs   # 【新增】
  - platform/hengzhun-regression-system/scripts/verification/rf003-s1-version-baseline.test.cjs   # 锚点翻转
  - docs/architecture/refactoring/batches/RF-003/**（decision-log/evidence-index/contract-delta 更新）
  - platform/hengzhun-regression-system/.data/tests/rf003-s2/**   # 隔离产物，用完清理

forbiddenPaths:
  - contracts/**（合同零变更，contractVersion 即权威）；harness/**、flowise/**、worker/**
  - 生产进程/DB 操作（验证用隔离运行态）；SQLite 迁移；切流
  - agent/backlog.yaml, agent/plans/active/v54-implementation-batches.md
  - scripts/architecture/**（校验器只读）

budgets:
  maxChangedFiles: 6
  maxNewFiles: 1
  maxChangedLines: 300
  maxContractsChanged: 0
  maxMigrationsAdded: 0
  maxOpenModules: 1（hengzhun.mcp）

invariants:
  - 合同 contractVersion 为唯一权威版本；SDK/健康仅派生
  - 启动失败关闭：合同缺失/版本非法 → 明确错误，不静默回退旧版本
  - 工具行为零变化（版本字段非工具语义）；ReleaseIdentity 不变（S1 已验证合同非身份输入）
  - 不读取/输出任何密钥与凭据

workSteps:
  - step: S2-1 版本派生实现
    action: server.cjs 读取合同 contractVersion（productRoot 相对路径），启动校验（存在+语义版本格式，失败关闭）；McpServer version 与 /health version 均用派生值
  - step: S2-2 锚点翻转
    action: rf003-s1 测试三源互异断言 → 三源一致断言（唯一版本=合同值）
  - step: S2-3 新增测试
    action: 'rf003-s2-version-unify.test.cjs：静态断言（无硬编码 8.0.0/10.0.0 于版本字段、version: contractVersion 派生）；隔离运行态（真实 MCP /health 返回 version==合同值；工具调用正常）'
  - step: S2-4 验证
    action: 新测试 + 全聚焦回归（60→N）+ 校验器×3 + git diff --check + 身份复算
  - step: S2-5 RC-D1 同步与提交
    action: contract-delta（V1/V2/V3 已实现）、decision-log 条目 3、evidence-index、任务包

