rollback:
  triggerConditions: 三源不一致；启动失败关闭异常；工具行为回归；身份变化
  recoveryPoint: 5460d7c + RF-003 baseline；回滚 server.cjs 版本派生与测试
  maxRtoMinutes: 30
  maxRpoMinutes: 0

exclusions: S3（生产切流关闭）；合同变更；任何工具行为变更

risks:
  - /health version 从 10.0.0 → 10.1.0 属预期消费者可见变化（版本字段非语义契约，登记即可）
  - 合同读取路径须与生产运行目录一致（FLOWISE_APP_PATH 等不受影响；合同在产品根固定路径）
