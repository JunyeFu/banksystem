# 单业务目标：把版本统一变更（S2）通过受管重启上线生产，实时探测 /health 版本与
# 工具面，观察收口后关闭批次并解禁 RF-004。
# 单功能点：生产切流、观察与批次关闭。
businessGoal:
  - 生产切流：受管 stop → start-i10.ps1（新 MCP 加载版本统一；发布回读三项 Hash 与基线一致）
  - 生产实时探测：/health version == 10.1.0（合同值）；工具调用规范信封正常；错误码保留
  - 观察：身份 632ad5ee、18 链 18/18、四服务健康
  - 回退通道：git 恢复 + 受管重启（硬回退）
  - 批次关闭：batch.yaml PROPOSED→CLOSED；v54 RF-003 条目更新；backlog RF-003 DONE；RF-004 解禁登记；L2 C1/C5 闭合
functionalPoint: 生产切流与批次关闭（RUNTIME）
evidenceLevel: RUNTIME_CUTOVER + RUNTIME_OBSERVE

allowedPaths:
  - docs/architecture/refactoring/batches/RF-003/batch.yaml（status → CLOSED）
  - docs/architecture/refactoring/batches/RF-003/**（decision-log/evidence-index/verification-plan/cutover/rollback runbook 收口）
  - docs/architecture/refactoring/l2-batch-preplan.md（C1/C5 闭合登记）
  - agent/plans/active/v54-implementation-batches.md（RF-003 条目更新，用户已批准本切片）
  - agent/backlog.yaml（RF-003 DONE，用户已批准本切片）
  - 生产环境受管操作：stop/start/实时探测（用户授权）

forbiddenPaths:
  - 运行时代码零改动；合同零变更；SQLite 迁移；新功能
  - scripts/architecture/**（校验器只读）；生产 DB 直接写入

budgets:
  maxChangedFiles: 10
  maxNewFiles: 0
  maxChangedLines: 150
  maxContractsChanged: 0
  maxMigrationsAdded: 0
  maxOpenModules: 0

invariants:
  - 切流只经受管命令；不伪造观察证据
  - 任何探测失败即暂停关闭并如实记录（批次保持 PROPOSED）
  - 密钥不输出；生产 DB 不直写

workSteps:
  - step: S3-1 预检
    action: 全聚焦 62/62 复跑、身份复算、18 链账本、切流前状态记录（生产 /health 当前报 10.0.0）
  - step: S3-2 生产切流
    action: 受管 stop → start-i10.ps1（新 MCP 加载版本统一）；确认四服务健康、模型探针 mock=false、发布回读三项 Hash 与基线一致
  - step: S3-3 生产实时探测
    action: /health version == 10.1.0（合同值）；task_get/schedule_get 未知 → 规范 8 字段信封+errorCode；verification_get 规范信封
  - step: S3-4 观察与身份
    action: 身份 632ad5ee、18 链 18/18、生产影子保持关闭、观察记录
  - step: S3-5 批次关闭
    action: batch.yaml PROPOSED→CLOSED（validate_refactoring PASS）；v54 RF-003 条目（CLOSED+RF-004 解禁）；backlog RF-003 DONE；L2 C1/C5 闭合登记
  - step: S3-6 RC-D1 同步与提交
    action: decision-log 条目 4、evidence-index、cutover/rollback runbook 收口、任务包；提交

verification:
  requiredCommands:
    - name: preflight-focused
      command: runtime/node-v20.20.2-win-x64/node.exe --test scripts/verification/rf001-*.cjs scripts/verification/rf002-*.cjs scripts/verification/rf003-*.cjs（全聚焦）
      expectedExitCode: 0
      expectedOutput: 62 passed / 0 failed
      blocking: true
    - name: production-cutover
      command: 受管 stop + start-i10.ps1
      expectedExitCode: 0
      expectedOutput: 四服务健康、探针 mock=false、回读三项 Hash 一致
      blocking: true
    - name: production-probes
      command: 生产 MCP 实时探测（/health 版本 + 工具规范信封）
      expectedExitCode: 0
      expectedOutput: /health version==10.1.0、工具规范信封+errorCode
      blocking: true
    - name: runtime-release-identity / 18chain
      command: i10-release-identity.cjs + i10-18-chain-acceptance-live.cjs status
      expectedExitCode: 0
      expectedOutput: identityHash=632ad5ee…、18/18
      blocking: true
    - name: refactoring-contracts / rf001-mcp-boundary-contract / documentation
      command: python scripts/architecture/validate_refactoring.py && python scripts/architecture/validate_rf001_contract.py && python scripts/docs/validate_docs.py
      expectedExitCode: 0
      expectedOutput: 三者PASS（含 batch CLOSED 状态）
      blocking: true
    - name: whitespace
      command: git diff --check
      expectedExitCode: 0
      blocking: true

rollback:
  triggerConditions: 生产探测异常（版本/信封/错误码漂移）；身份或 18 链变化；发布回读不一致
  recoveryPoint: 0d57ec4 + RF-003 baseline；git 恢复旧代码 + 受管重启（硬回退）
  maxRtoMinutes: 30
  maxRpoMinutes: 0

exclusions: RF-004（解禁登记，不启动）；任何新功能/代码变更

risks:
  - 生产重启中断观察中的正式会话（Flowise 会话持久化，RF-001/002 已验证同路径）
  - /health 版本 10.0.0→10.1.0 为登记预期变化（S2 已登记）
