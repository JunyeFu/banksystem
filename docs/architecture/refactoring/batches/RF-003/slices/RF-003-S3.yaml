parentBatch: docs/architecture/refactoring/batches/RF-003/batch.yaml
targetDesign: docs/architecture/refactoring/batches/RF-003/target-design.md (v1.0 已批准)
baseline:
  gitCommit: 0d57ec4（RF-003 分支，S1/S2 已完成）
  releaseIdentity: 632ad5ee7981b59f00824d0072d28da6075eef095d55a898d51c0103a897988f
