    - name: rf002-focused-tests
      command: runtime/node-v20.20.2-win-x64/node.exe --test scripts/verification/rf001-*.cjs scripts/verification/rf002-*.cjs（全聚焦回归）
      expectedExitCode: 0
      expectedOutput: 56 passed / 0 failed
      blocking: true
    - name: refactoring-contracts / rf001-mcp-boundary-contract / documentation
      command: python scripts/architecture/validate_refactoring.py && python scripts/architecture/validate_rf001_contract.py && python scripts/docs/validate_docs.py
      expectedExitCode: 0
      blocking: true
    - name: runtime-release-identity
      command: runtime/node-v20.20.2-win-x64/node.exe scripts/i10-release-identity.cjs
      expectedExitCode: 0
      expectedOutput: identityHash=632ad5ee…
      blocking: true
    - name: whitespace
      command: git diff --check
      expectedExitCode: 0
      blocking: true

