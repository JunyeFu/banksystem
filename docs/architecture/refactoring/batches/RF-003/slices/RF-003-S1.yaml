# 单业务目标：冻结版本三源漂移现状为机器断言基线（SDK 8.0.0 / 健康 10.0.0 /
# 合同 10.1.0），并验证版本统一计划的安全性（合同文件不属于 ReleaseIdentity
# 输入），为 S2 统一实现提供可测切换锚点。零运行时代码改动。
functionalPoint: 版本契约考古与基线（CONTRACT级）

allowedPaths:
  - docs/architecture/refactoring/batches/RF-003/**
  - platform/hengzhun-regression-system/scripts/verification/rf003-s1-version-baseline.test.cjs   # 【新增】
  - platform/hengzhun-regression-system/mcp/src/**、contracts/**   # 只读引用（测试读取），零改动

forbiddenPaths:
  - mcp/contracts/harness/flowise/worker 源码零改动（仅测试只读引用）
  - 生产进程/DB 操作；SQLite 迁移；切流；agent/backlog.yaml
  - scripts/architecture/**（校验器只读）

budgets:
  maxChangedFiles: 4
  maxNewFiles: 1
  maxChangedLines: 200
  maxContractsChanged: 0
  maxMigrationsAdded: 0
  maxOpenModules: 0

invariants:
  - 零运行时代码改动；测试只读引用源码文件
  - 基线断言基于当前文件内容的确定性核对
  - 不读取/输出任何密钥与凭据

workSteps:
  - step: S1-1 三源现状断言
    action: 测试断言 server.cjs SDK version=8.0.0、健康 version=10.0.0、合同 contractVersion=10.1.0（漂移基线登记，S2 反转锚点）
  - step: S1-2 版本策略断言
    action: 断言 RF-001 边界合同 versionPolicy 存在且含 contractVersionSource（B2 已冻结）
  - step: S1-3 身份安全性验证
    action: 断言 contracts/mcp/hengzhun-i8.json 不在 i10-release-identity.cjs 的输入清单中（版本统一不改变身份）
  - step: S1-4 差异表与证据
    action: contract-delta 更新（现状→V1/V2/V3 差异表）；decision-log 条目 2；evidence-index
  - step: S1-5 RC-D1 同步与提交

