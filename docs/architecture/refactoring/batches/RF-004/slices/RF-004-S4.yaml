      command: runtime/node-v20.20.2-win-x64/node.exe --test scripts/verification/rf001-*.cjs scripts/verification/rf002-*.cjs scripts/verification/rf003-*.cjs scripts/verification/rf004-*.cjs（全聚焦）
      expectedExitCode: 0
      expectedOutput: 75 passed / 0 failed
