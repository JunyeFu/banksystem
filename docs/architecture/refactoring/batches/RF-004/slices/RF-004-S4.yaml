      expectedExitCode: 0
      expectedOutput: 四服务健康、探针 mock=false、回读三项 Hash 一致
      blocking: true
    - name: production-probes
      command: 生产 MCP 实时探测（run_submit 失败关闭 + 工具规范信封）
      expectedExitCode: 0
      expectedOutput: run_submit 无凭据 409、工具规范信封+errorCode
      blocking: true
    - name: runtime-release-identity / 18chain
      command: i10-release-identity.cjs + i10-18-chain-acceptance-live.cjs status
      expectedExitCode: 0
      expectedOutput: identityHash=632ad5ee…、18/18
