  recoveryPoint: c0f9b99 + RF-004 baseline；软回退 HENGZHUN_RF004_LEGACY_CREDENTIAL=1；硬回退 git 恢复 + 受管重启
  maxRtoMinutes: 30
  maxRpoMinutes: 0

exclusions: RF-005（解禁登记，不启动）；任何新功能/代码变更

risks:
  - 生产 DB 中既有案例若无 credentialRef 且未开 LEGACY，正式执行将被失败关闭拦截——切流后首次探测确认；若实际存在此类案例，评估开 LEGACY 过渡或补 case 凭据
  - 生产重启中断观察中的正式会话（Flowise 会话持久化，已验证路径）
