# 单业务目标：把凭据绑定迁移（S2 MCP 停注入 + S3 Harness 解析）通过受管重启上线
# 生产，实时探测执行链，观察收口后关闭批次并解禁 RF-005。
# 单功能点：生产切流、观察与批次关闭。
businessGoal:
  - 生产切流：受管 stop → start-i10.ps1（新 dist Harness + 新 MCP；发布回读三项 Hash 与基线一致）
  - 生产实时探测：run_submit 无注入+无凭据 case → 409 I10_EXECUTION_CREDENTIAL_BINDING_REQUIRED（失败关闭验证）；LEGACY 注入路径不受影响（重启不带 LEGACY 时，已有案例凭据链正常）；task_get/schedule_get 规范信封
  - 观察：身份 632ad5ee、18 链 18/18、四服务健康、生产影子关闭
  - 回退通道：HENGZHUN_RF004_LEGACY_CREDENTIAL=1 软回退（i3-customer 注入）+ git 恢复硬回退
  - 批次关闭：batch.yaml PROPOSED→CLOSED；v54 RF-004 条目更新；backlog RF-004 DONE；RF-005 解禁登记；L2 C2/C5 闭合
functionalPoint: 生产切流与批次关闭（RUNTIME）
evidenceLevel: RUNTIME_CUTOVER + RUNTIME_OBSERVE

allowedPaths:
  - docs/architecture/refactoring/batches/RF-004/batch.yaml（status → CLOSED）
  - docs/architecture/refactoring/batches/RF-004/**（decision-log/evidence-index/verification-plan/cutover/rollback runbook 收口）
  - docs/architecture/refactoring/l2-batch-preplan.md（C2/C5 闭合登记）
  - agent/plans/active/v54-implementation-batches.md（RF-004 条目更新，用户已批准本切片）
  - agent/backlog.yaml（RF-004 DONE，用户已批准本切片）
  - 生产环境受管操作：stop/start/实时探测（用户授权）

forbiddenPaths:
  - 运行时代码零改动；SQLite 迁移；新功能
  - scripts/architecture/**（校验器只读）；生产 DB 直接写入

budgets:
  maxChangedFiles: 10
  maxNewFiles: 0
  maxChangedLines: 150
  maxContractsChanged: 0
  maxMigrationsAdded: 0
  maxOpenModules: 0

invariants:
  - 切流只经受管命令；不伪造观察证据
  - 任何探测失败即暂停关闭并如实记录（批次保持 PROPOSED）
  - 密钥不输出；生产 DB 不直写

workSteps:
  - step: S4-1 预检
    action: 全聚焦 75/75 复跑、身份复算、18 链账本、切流前状态记录
  - step: S4-2 生产切流
    action: 受管 stop → start-i10.ps1（新 dist Harness 加载 S3 解析、新 MCP 加载 S2 停注入）；确认四服务健康、模型探针 mock=false、发布回读三项 Hash 与基线一致
  - step: S4-3 生产实时探测
    action: run_submit（无注入，无凭据 preparationId）→ 409 I10_EXECUTION_CREDENTIAL_BINDING_REQUIRED（失败关闭）；task_get/schedule_get/verification_get 规范 8 字段信封+errorCode；LEGACY 通道经开关确认（探测进程带 HENGZHUN_RF004_LEGACY_CREDENTIAL=1 复测注入路径——若需要可跳过生产复测，以 S3 隔离测试为准）
  - step: S4-4 观察与身份
    action: 身份 632ad5ee、18 链 18/18、生产影子保持关闭、观察记录
  - step: S4-5 批次关闭
    action: batch.yaml PROPOSED→CLOSED（validate_refactoring PASS）；v54 RF-004 条目（CLOSED+RF-005 解禁）；backlog RF-004 DONE；L2 C2/C5 闭合登记
  - step: S4-6 RC-D1 同步与提交
    action: decision-log 条目 5、evidence-index、cutover/rollback runbook 收口、任务包；提交

