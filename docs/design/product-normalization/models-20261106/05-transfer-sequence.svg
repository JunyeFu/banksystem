<text data-cell="view-subtitle" x="42.0" y="85.0" text-anchor="start"><tspan x="42.0" dy="0">应用逻辑时序；省略认证握手/投影细节。每个TX独立提交，不跨网络持有本地事务</tspan></text>
<text data-cell="view-note" x="42.0" y="955.0" text-anchor="start"><tspan x="42.0" dy="0">无领取权、5xx或网络故障不盲重发POST；明确4xx也先核原操作。页面超时但核心成功时，业务成功与测试失败可同时成立。</tspan></text>
