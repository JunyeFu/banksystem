<text data-cell="view-subtitle" x="42.0" y="85.0" text-anchor="start"><tspan x="42.0" dy="0">应用逻辑时序；MCP作为受控传输显式保留，作业实际以Harness领取协议推进</tspan></text>
<text data-cell="view-note" x="42.0" y="1055.0" text-anchor="start"><tspan x="42.0" dy="0">稳定性验证后才冻结脚本用于正式/周期执行；周期回归不每次自由规划。反馈要独立验证再匹配消费，不改写原失败或业务预期。</tspan></text>
