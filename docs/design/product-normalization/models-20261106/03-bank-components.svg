<text data-cell="view-note" x="42.0" y="795.0" text-anchor="start"><tspan x="42.0" dy="0">Controller不直接SQL；只读投影可直接用具名Repository。渠道账务投影不是Fineract总账；公网生产部署不在本图承诺内。</tspan></text>
