<text data-cell="view-title" x="42.0" y="30.0" text-anchor="start" style="font-size:22px;font-weight:600"><tspan x="42.0" dy="0">领域关系｜关联不等于跨库外键</tspan></text>
<text data-cell="view-subtitle" x="42.0" y="85.0" text-anchor="start"><tspan x="42.0" dy="0">逻辑领域关系，不是物理ER或完整DDL；实线标签说明关系，省略基数时不暗示数据库约束</tspan></text>
<text data-cell="view-note" x="42.0" y="785.0" text-anchor="start"><tspan x="42.0" dy="0">资金核心、渠道流程和Harness各有状态所有者；业务correlation用于核验关联，不由平台直接SQL写核心，也不是跨库事务。</tspan></text>
