  <rect x="1268" y="62" width="75" height="27" rx="13.5" fill="#eadde0"/>
  <text x="1305.5" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" letter-spacing="1.5" fill="#9f1838">DEMO</text>
