server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${CHANNEL_DB_URL:jdbc:postgresql://bank-channel-postgres:5432/bank_channel}
    username: ${CHANNEL_DB_USER:bank_channel}
    password: ${CHANNEL_DB_PASSWORD}
  sql:
    init:
      mode: always
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  activemq:
    broker-url: tcp://mifos-isolated-activemq-1:61616
    user: admin
    password: ${FINERACT_DB_PASS:admin}
    packages:
      trust-all: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BANK_CUSTOMER_ISSUER_URI:http://127.0.0.1:19000/realms/bank-customer}
          jwk-set-uri: ${BANK_CUSTOMER_JWK_SET_URI:http://keycloak:8080/realms/bank-customer/protocol/openid-connect/certs}
fineract:
  base-url: ${FINERACT_BASE_URL:http://mifos-isolated-fineract-server-1:8080/fineract-provider}
  tenant: ${FINERACT_TENANT:default}
  username: ${FINERACT_USERNAME}
  password: ${FINERACT_PASSWORD}
clearing:
  callback-secret: ${CLEARING_CALLBACK_SECRET}
bank:
  issuer:
    customer-uri: ${BANK_CUSTOMER_ISSUER_URI:http://127.0.0.1:19000/realms/bank-customer}
    customer-jwk-uri: ${BANK_CUSTOMER_JWK_SET_URI:http://keycloak:8080/realms/bank-customer/protocol/openid-connect/certs}
    internal-uri: ${BANK_INTERNAL_ISSUER_URI:http://127.0.0.1:19000/realms/bank-internal}
    internal-jwk-uri: ${BANK_INTERNAL_JWK_SET_URI:http://keycloak:8080/realms/bank-internal/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: bank-channel-service
