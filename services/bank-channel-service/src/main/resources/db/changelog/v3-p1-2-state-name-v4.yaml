databaseChangeLog:
  - changeSet:
      id: v3-p1-2-state-name-v4
      author: BankingDomainAgent
      comment: Convert pre-v4 transfer state names to v4 §10 standard names.
      changes:
        - sql:
            splitStatements: false
            sql: |
              UPDATE transfer SET status = CASE status
                WHEN 'RISK_PENDING' THEN 'VALIDATING'
                WHEN 'REVIEW_REQUIRED' THEN 'RISK_REVIEW'
                WHEN 'APPROVED' THEN 'PENDING_APPROVAL'
                WHEN 'RESERVED' THEN 'PENDING_CORE_POSTING'
                WHEN 'SUBMITTED' THEN 'PENDING_CLEARING'
                ELSE status END
              WHERE status IN ('RISK_PENDING','REVIEW_REQUIRED','APPROVED','RESERVED','SUBMITTED');
              UPDATE transfer_state_history SET from_status = CASE from_status
                WHEN 'RISK_PENDING' THEN 'VALIDATING' WHEN 'REVIEW_REQUIRED' THEN 'RISK_REVIEW'
                WHEN 'APPROVED' THEN 'PENDING_APPROVAL' WHEN 'RESERVED' THEN 'PENDING_CORE_POSTING'
                WHEN 'SUBMITTED' THEN 'PENDING_CLEARING' ELSE from_status END;
              UPDATE transfer_state_history SET to_status = CASE to_status
                WHEN 'RISK_PENDING' THEN 'VALIDATING' WHEN 'REVIEW_REQUIRED' THEN 'RISK_REVIEW'
                WHEN 'APPROVED' THEN 'PENDING_APPROVAL' WHEN 'RESERVED' THEN 'PENDING_CORE_POSTING'
                WHEN 'SUBMITTED' THEN 'PENDING_CLEARING' ELSE to_status END;