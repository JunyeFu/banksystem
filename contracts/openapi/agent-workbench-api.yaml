  securitySchemes:
    LocalCsrf:
      type: apiKey
      in: header
      name: X-Hengzhun-CSRF
      description: Process-local token from same-origin bootstrap. Mutations also require an exact Origin and Host. Not a Harness service token.
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
      required:
        - type
        - title
        - status
        - code
      additionalProperties: false
  responses:
    Problem:
      description: Explicit failure; no raw dependency error or credential details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
