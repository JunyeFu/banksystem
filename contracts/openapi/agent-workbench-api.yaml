openapi: 3.1.0
info:
  title: Hengzhun Local Agent Workbench
  version: 1.1.0
  description: Same-origin loopback browser transport to the existing CLI Controller. Harness SQLite owns state; Quality APIs remain
    read-only. Only safe execution summaries are exposed, never private reasoning or raw checkpoints.
  license:
    name: Mozilla Public License 2.0
    identifier: MPL-2.0
servers:
  - url: /api/agent/v1
paths:
  /bootstrap:
    get:
      operationId: getAgentBootstrap
      summary: getAgentBootstrap
      security: []
      responses:
        "200":
          description: getAgentBootstrap
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  status:
                    type: string
                    enum:
                      - READY
                      - NOT_READY
                  releaseIdentityHash:
                    anyOf:
                      - type: string
                        pattern: ^[a-f0-9]{64}$
                      - type: "null"
                  environment:
                    type: string
                    const: LOCAL
                  blockingReasons:
                    maxItems: 20
                    type: array
                    items:
                      type: string
                      pattern: ^[A-Z][A-Z0-9_]{2,100}$
                required:
                  - csrfToken
                  - status
                  - releaseIdentityHash
                  - environment
                  - blockingReasons
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /conversations:
    get:
      operationId: listAgentConversations
      summary: listAgentConversations
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
        - name: limit
          in: query
          required: false
          schema:
            default: 30
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: listAgentConversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        title:
                          type: string
                          minLength: 1
                          maxLength: 120
                        status:
                          type: string
                          enum:
                            - IDLE
                            - RUNNING
                            - NEEDS_INPUT
                            - COMPLETED
                            - FAILED
                            - STOP_REQUESTED
                            - INTERRUPTED
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        updatedAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        lastTurnId:
                          anyOf:
                            - type: string
                              format: uuid
                              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                            - type: "null"
                      required:
                        - id
                        - title
                        - status
                        - createdAt
                        - updatedAt
                        - lastTurnId
                      additionalProperties: false
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - conversations
                  - nextCursor
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAgentConversation
      summary: createAgentConversation
      security:
        - LocalCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
              required:
                - title
              additionalProperties: false
      responses:
        "201":
          description: createAgentConversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  title:
                    type: string
                    minLength: 1
                    maxLength: 120
                  status:
                    type: string
                    enum:
                      - IDLE
                      - RUNNING
                      - NEEDS_INPUT
                      - COMPLETED
                      - FAILED
                      - STOP_REQUESTED
                      - INTERRUPTED
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  updatedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  lastTurnId:
                    anyOf:
                      - type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      - type: "null"
                required:
                  - id
                  - title
                  - status
                  - createdAt
                  - updatedAt
                  - lastTurnId
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /conversations/{conversationId}:
    get:
      operationId: getAgentConversation
      summary: getAgentConversation
      description: Newest message page, displayed oldest-first; before/nextMessageCursor loads older messages. Include only turns linked from this
        page. Bound pages to the existing Harness/MCP byte budget, without truncating message text.
      security: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: limit
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 30
      responses:
        "200":
          description: Newest message page, displayed oldest-first; before/nextMessageCursor loads older messages. Include only turns linked from this
            page. Bound pages to the existing Harness/MCP byte budget, without truncating message text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      title:
                        type: string
                        minLength: 1
                        maxLength: 120
                      status:
                        type: string
                        enum:
                          - IDLE
                          - RUNNING
                          - NEEDS_INPUT
                          - COMPLETED
                          - FAILED
                          - STOP_REQUESTED
                          - INTERRUPTED
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                      updatedAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                      lastTurnId:
                        anyOf:
                          - type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          - type: "null"
                    required:
                      - id
                      - title
                      - status
                      - createdAt
                      - updatedAt
                      - lastTurnId
                    additionalProperties: false
                  messages:
                    maxItems: 30
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        role:
                          type: string
                          enum:
                            - user
                            - assistant
                        text:
                          type: string
                          minLength: 1
                          maxLength: 16000
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        turnId:
                          anyOf:
                            - type: string
                              format: uuid
                              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                            - type: "null"
                      required:
                        - id
                        - role
                        - text
                        - createdAt
                        - turnId
                      additionalProperties: false
                  turns:
                    maxItems: 30
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        conversationId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        version:
                          type: integer
                          minimum: 1
                          maximum: 9007199254740991
                        status:
                          type: string
                          enum:
                            - RUNNING
                            - NEEDS_INPUT
                            - COMPLETED
                            - FAILED
                            - STOP_REQUESTED
                            - INTERRUPTED
                        inputMessageId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        modelBinding:
                          type: object
                          properties:
                            profileId:
                              type: string
                              format: uuid
                              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                            profileVersion:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                            model:
                              type: string
                              minLength: 1
                              maxLength: 160
                            baseUrlHash:
                              type: string
                              pattern: ^[a-f0-9]{64}$
                            releaseIdentityHash:
                              type: string
                              pattern: ^[a-f0-9]{64}$
                          required:
                            - profileId
                            - profileVersion
                            - model
                            - baseUrlHash
                            - releaseIdentityHash
                          additionalProperties: false
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        updatedAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        checkpointSessionId:
                          type: string
                          pattern: ^session-[a-f0-9]{32}$
                        journeyId:
                          type: string
                          minLength: 1
                          maxLength: 160
                        runId:
                          type: string
                          minLength: 1
                          maxLength: 160
                        taskId:
                          type: string
                          minLength: 1
                          maxLength: 160
                        events:
                          maxItems: 100
                          type: array
                          items:
                            type: object
                            properties:
                              sequence:
                                type: integer
                                minimum: 1
                                maximum: 9007199254740991
                              type:
                                type: string
                                enum:
                                  - ACCEPTED
                                  - PLANNING
                                  - TOOL_STARTED
                                  - TOOL_FINISHED
                                  - NEEDS_INPUT
                                  - COMPLETED
                                  - FAILED
                                  - STOP_REQUESTED
                                  - INTERRUPTED
                              summary:
                                type: string
                                minLength: 1
                                maxLength: 500
                              createdAt:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                              toolName:
                                type: string
                                pattern: ^[a-z][a-z0-9_]{1,80}$
                            required:
                              - sequence
                              - type
                              - summary
                              - createdAt
                            additionalProperties: false
                        hasMoreEvents:
                          type: boolean
                        answer:
                          type: string
                          minLength: 1
                          maxLength: 16000
                        failureCode:
                          type: string
                          pattern: ^[A-Z][A-Z0-9_]{2,100}$
                        humanInterventionRequired:
                          type: boolean
                        continuationOfTurnId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        result:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum:
                                - REPLY
                                - TEST
                            verdict:
                              type: string
                              enum:
                                - NOT_RUN
                                - PASSED
                                - FAILED
                                - UNKNOWN
                          required:
                            - kind
                            - verdict
                          additionalProperties: false
                      required:
                        - id
                        - conversationId
                        - version
                        - status
                        - inputMessageId
                        - modelBinding
                        - createdAt
                        - updatedAt
                        - events
                        - hasMoreEvents
                        - humanInterventionRequired
                        - result
                      additionalProperties: false
                  nextMessageCursor:
                    anyOf:
                      - type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      - type: "null"
                required:
                  - conversation
                  - messages
                  - turns
                  - nextMessageCursor
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /conversations/{conversationId}/messages:
    post:
      operationId: submitAgentMessage
      summary: submitAgentMessage
      description: Atomically persist the submission ID before execution; repeat IDs return the original turn, never replay the bank task. A
        different payload with the same ID returns 409.
      security:
        - LocalCsrf: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submissionId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                input:
                  type: string
                  minLength: 1
                  maxLength: 16000
                modelProfileId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                modelProfileVersion:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                attachmentRefs:
                  default: []
                  maxItems: 5
                  type: array
                  items:
                    type: string
                    pattern: ^att_[a-zA-Z0-9_-]{8,160}$
                attachmentMetadata:
                  maxItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      attachmentRef:
