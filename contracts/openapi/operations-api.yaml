openapi: 3.1.1
info:
  title: Bank Operations API
  version: 0.1.0
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  description: Internal operations and money-changing contract.
servers:
  - url: /api/operations/v1
security:
  - bearerAuth: []
paths:
  /dashboard:
    get:
      operationId: getOperationsDashboard
      summary: Get the operational dashboard snapshot
      responses:
        '200':
          description: Current operational workload and service-health snapshot
          content:
            application/json: { schema: { $ref: '#/components/schemas/OperationsDashboard' } }
        '401': { $ref: '#/components/responses/Problem' }
  /risk/alerts:
    get:
      operationId: listRiskAlerts
      summary: List risk alerts derived from persisted risk decisions
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RiskAlertStatus' } }
      responses:
        '200':
          description: Risk alert list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RiskAlert' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /risk/cases:
    get:
      operationId: listRiskCases
      summary: List risk cases and maker-checker review state
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RiskCaseStatus' } }
      responses:
        '200':
          description: Risk case list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RiskCase' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /approvals:
    get:
      operationId: listApprovals
      summary: List transfer-reversal approval records
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ApprovalStatus' } }
      responses:
        '200':
          description: Approval queue
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApprovalRecord' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /clearing/batches:
    get:
      operationId: listClearingBatches
      summary: List daily clearing batches aggregated from clearing payments
      responses:
        '200':
          description: Clearing batch list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClearingBatch' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /reconciliations:
    get:
      operationId: listReconciliations
      summary: List reconciliation runs
      responses:
        '200':
          description: Reconciliation run list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReconciliationRun' } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: runReconciliation
      summary: Execute a reconciliation type synchronously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties: { type: { $ref: '#/components/schemas/ReconciliationType' } }
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReconciliationRun' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /eod/latest:
    get:
      operationId: getLatestEodRun
      summary: Get the latest end-of-day run
      responses:
        '200':
          description: Latest run or NOT_STARTED sentinel
          content:
            application/json: { schema: { $ref: '#/components/schemas/EodRun' } }
        '401': { $ref: '#/components/responses/Problem' }
  /eod/run:
    post:
      operationId: runEod
      summary: Execute the guarded end-of-day workflow
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: End-of-day result
          content:
            application/json: { schema: { $ref: '#/components/schemas/EodRun' } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /transfers:
    get:
      operationId: listOperationsTransfers
      summary: List transfers for operational monitoring
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransferStatus' } }
        - { name: currency, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: query, in: query, description: "Transfer ID, core reference or correlation ID fragment", schema: { type: string, maxLength: 120 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Transfer monitoring page
          content:
            application/json: { schema: { $ref: '#/components/schemas/TransferPage' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOperationsTransfer
      summary: Submit an idempotent transfer request
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '202':
          description: Accepted for state-machine processing
          content:
            application/json: { schema: { $ref: '#/components/schemas/Transfer' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /transfers/export:
    get:
      operationId: exportOperationsTransfers
      summary: Export the filtered transfer monitoring result as CSV
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransferStatus' } }
        - { name: currency, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: UTF-8 CSV with at most 10,000 filtered transfers
          content:
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    get:
      operationId: getOperationsTransfer
      summary: Get transfer status
      responses:
        '200':
          description: Transfer state
          content:
            application/json: { schema: { $ref: '#/components/schemas/TransferDetail' } }
        '404': { $ref: '#/components/responses/Problem' }
  /transfers/{transferId}/reversal:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      operationId: requestTransferReversal
      summary: Request a maker-checker transfer reversal
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 240 } } }
      responses:
        '200': { description: Pending reversal }
        '409': { $ref: '#/components/responses/Problem' }
  /documents:
    get:
      operationId: listOperationsDocuments
      summary: List persisted operations documents
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/DocumentCategory' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DocumentStatus' } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: Document metadata list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OperationsDocument' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: uploadOperationsDocument
      summary: Upload a document into the governed operations repository
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, category]
              properties:
                file: { type: string, format: binary }
                title: { type: string, minLength: 1, maxLength: 240 }
                category: { $ref: '#/components/schemas/DocumentCategory' }
                description: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Uploaded document metadata
          content:
            application/json: { schema: { $ref: '#/components/schemas/OperationsDocument' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /documents/{documentId}/status:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateOperationsDocumentStatus
      summary: Publish or archive an operations document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { $ref: '#/components/schemas/DocumentStatus' } }
      responses:
        '200':
          description: Updated document metadata
          content:
            application/json: { schema: { $ref: '#/components/schemas/OperationsDocument' } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /documents/{documentId}/download:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadOperationsDocument
      summary: Download governed document content
      responses:
        '200':
          description: Original document bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /audit/events:
    get:
      operationId: listAuditEvents
      summary: Query immutable security audit events
      parameters:
        - { name: eventType, in: query, schema: { type: string, maxLength: 128 } }
        - { name: actorId, in: query, schema: { type: string, maxLength: 128 } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/AuditOutcome' } }
        - { name: correlationId, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Audit event list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /audit/verify:
    get:
      operationId: verifyAuditHashChain
      summary: Verify audit-event hash continuity and record integrity
      responses:
        '200':
          description: Hash-chain verification result
          content:
            application/json: { schema: { $ref: '#/components/schemas/HashChainVerification' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /system-health:
    get:
      operationId: getSystemHealth
      summary: Get service and active-alert health snapshot
      responses:
        '200':
          description: Current system health snapshot
          content:
            application/json: { schema: { $ref: '#/components/schemas/SystemHealthSnapshot' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /internal/monitoring/alerts:
    get:
      operationId: getMonitoringAlerts
      summary: Get active operational alerts
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: No service-blocking alert is active
          content:
            application/json: { schema: { $ref: '#/components/schemas/MonitoringAlertResponse' } }
        '503':
          description: A service-blocking alert is active
          headers:
            X-Alert:
              required: true
              schema: { type: string, example: EOD_FAILED }
          content:
            application/json: { schema: { $ref: '#/components/schemas/MonitoringAlertResponse' } }
  /transfers/reversals/{reversalId}/approve:
    parameters:
      - name: reversalId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: approveTransferReversal
      summary: Approve and post a compensating transfer
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 240 } } }
      responses:
        '200':
          description: Compensating transfer posted
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApprovalActionResult' } }
        '409': { $ref: '#/components/responses/Problem' }
  /transfers/reversals/{reversalId}/reject:
    parameters:
      - name: reversalId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: rejectTransferReversal
      summary: Reject a pending transfer reversal and restore the settled transfer state
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 240 } } }
      responses:
        '200':
          description: Reversal request rejected
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApprovalActionResult' } }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
  schemas:
    DocumentCategory:
      type: string
      enum: [POLICY, PROCEDURE, REPORT, COMPLIANCE, OTHER]
    DocumentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    OperationsDocument:
      type: object
      additionalProperties: false
      required: [documentId, title, category, status, version, uploadedBy, uploadedAt, fileName, contentType, fileSize, checksum]
      properties:
        documentId: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: '#/components/schemas/DocumentCategory' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        version: { type: integer, minimum: 1 }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        fileName: { type: string }
        contentType: { type: string }
        fileSize: { type: integer, minimum: 0 }
        checksum: { type: string, pattern: '^[0-9a-f]{64}$' }
        description: { type: [string, 'null'] }
    AuditOutcome:
      type: string
      enum: [SUCCESS, FAILURE, DENIED]
    AuditEvent:
      type: object
      additionalProperties: false
      required: [eventId, timestamp, eventType, actorId, action, resourceType, resourceId, outcome, recordHash]
      properties:
        eventId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        eventType: { type: string }
        actorId: { type: string }
        action: { type: string }
        resourceType: { type: [string, 'null'] }
        resourceId: { type: [string, 'null'] }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        recordHash: { type: string }
        previousHash: { type: [string, 'null'] }
        correlationId: { type: [string, 'null'] }
    HashChainVerification:
      type: object
      additionalProperties: false
      required: [verified, totalEvents, brokenAtEventId, lastVerifiedHash]
      properties:
        verified: { type: boolean }
        totalEvents: { type: integer, minimum: 0 }
        brokenAtEventId: { type: [string, 'null'], format: uuid }
        lastVerifiedHash: { type: [string, 'null'] }
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [serviceName, status, latencyMs]
      properties:
        serviceName: { type: string }
        status: { type: string, enum: [UP, DOWN] }
        latencyMs: { type: integer, minimum: 0 }
    MonitoringAlert:
      type: object
      additionalProperties: false
      required: [alertId, code, severity, status, serviceName, message, triggeredAt, labels]
      properties:
        alertId: { type: string }
        code: { type: string }
        severity: { type: string, enum: [INFO, WARNING, ERROR, CRITICAL] }
        status: { type: string, enum: [FIRING, RESOLVED] }
        serviceName: { type: string }
        message: { type: string }
        triggeredAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        labels: { type: object, additionalProperties: { type: string } }
    SystemHealthSnapshot:
      type: object
      additionalProperties: false
      required: [overallStatus, checkedAt, services, alerts]
      properties:
        overallStatus: { type: string, enum: [HEALTHY, DEGRADED] }
        checkedAt: { type: string, format: date-time }
        services: { type: array, items: { $ref: '#/components/schemas/ServiceHealth' } }
        alerts: { type: array, items: { $ref: '#/components/schemas/MonitoringAlert' } }
    ClearingBatchStatus:
      type: string
      enum: [PROCESSING, COMPLETED, FAILED]
    ClearingBatch:
      type: object
      additionalProperties: false
      required: [batchId, businessDate, status, totalItems, settledItems, failedItems, totalAmount, currency, startedAt, completedAt]
      properties:
        batchId: { type: string }
        businessDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/ClearingBatchStatus' }
        totalItems: { type: integer, minimum: 0 }
        settledItems: { type: integer, minimum: 0 }
        failedItems: { type: integer, minimum: 0 }
        totalAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    ReconciliationType:
      type: string
      enum: [CHANNEL_TO_CORE, CHANNEL_TO_CLEARING, CORE_TO_GENERAL_LEDGER]
    ReconciliationStatus:
      type: string
      enum: [RUNNING, MATCHED, DIFFERENCE_FOUND, FAILED]
    ReconciliationRun:
      type: object
      additionalProperties: false
      required: [runId, type, status, differenceCount, details, createdAt]
      properties:
        runId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ReconciliationType' }
        status: { $ref: '#/components/schemas/ReconciliationStatus' }
        differenceCount: { type: integer, minimum: 0 }
        details: { type: string }
        createdAt: { type: string, format: date-time }
    EodStatus:
      type: string
      enum: [NOT_STARTED, RUNNING, COMPLETED, FAILED]
    EodRun:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        runId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/EodStatus' }
        reconciliationStatus: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        stepsCompleted: { type: array, items: { type: string } }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ApprovalRecord:
      type: object
      additionalProperties: false
      required: [approvalId, reversalId, transferId, creator, status, reason, version, amount, currency, sourceAccountId, destinationAccountId, createdAt, updatedAt]
      properties:
        approvalId: { type: string, format: uuid }
        reversalId: { type: string, format: uuid }
        transferId: { type: string, format: uuid }
        creator: { type: string }
        checker: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        reason: { type: string }
        version: { type: integer, minimum: 1 }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        sourceAccountId: { type: string }
        destinationAccountId: { type: string }
        coreReference: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApprovalActionResult:
      type: object
      additionalProperties: false
      required: [reversalId, transferId, status, version]
      properties:
        reversalId: { type: string, format: uuid }
        transferId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        version: { type: integer, minimum: 1 }
        coreReference: { type: [string, 'null'] }
    RiskAlertStatus:
      type: string
      enum: [ACTIVE, RESOLVED]
    RiskCaseStatus:
      type: string
      enum: [OPEN, UNDER_REVIEW, APPROVED]
    RiskAlert:
      type: object
      additionalProperties: false
      required: [alertId, severity, status, ruleName, entityType, entityId, description, score, triggeredAt]
      properties:
        alertId: { type: string, format: uuid }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { $ref: '#/components/schemas/RiskAlertStatus' }
        ruleName: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        description: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        triggeredAt: { type: string, format: date-time }
        acknowledgedBy: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
    RiskCase:
      type: object
      additionalProperties: false
      required: [caseId, transferId, customerSubject, decision, status, score, triggeredRules, maker, version, createdAt]
      properties:
        caseId: { type: string, format: uuid }
        transferId: { type: string, format: uuid }
        customerSubject: { type: string }
        decision: { type: string, enum: [ALLOW, REVIEW, BLOCK] }
        status: { $ref: '#/components/schemas/RiskCaseStatus' }
        score: { type: integer, minimum: 0, maximum: 100 }
        triggeredRules: { type: array, items: { type: string } }
        maker: { type: string }
        checker: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
    OperationsDashboard:
      type: object
      additionalProperties: false
      required: [generatedAt, pendingApprovals, clearingStatus, reconciliationStatus, activePayments, failedPayments, systemHealth, todayPaymentAmount, todayPaymentCount, successRate, pendingAlerts]
      properties:
        generatedAt: { type: string, format: date-time }
        pendingApprovals: { type: integer, minimum: 0 }
        clearingStatus: { type: string, enum: [NORMAL, ATTENTION] }
        reconciliationStatus: { type: string, enum: [MATCHED, DIFFERENCE, NOT_RUN] }
        activePayments: { type: integer, minimum: 0 }
        failedPayments: { type: integer, minimum: 0 }
        systemHealth: { type: string, enum: [HEALTHY, DEGRADED] }
        todayPaymentAmount: { $ref: '#/components/schemas/Money' }
        todayPaymentCount: { type: integer, minimum: 0 }
        successRate: { type: number, format: double, minimum: 0, maximum: 100 }
        pendingAlerts: { type: integer, minimum: 0 }
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$'
    TransferStatus:
      type: string
      enum: [CREATED, VALIDATING, RISK_REVIEW, PENDING_APPROVAL, PENDING_CORE_POSTING, PENDING_CLEARING, SETTLED, FAILED, TIMED_OUT, RETURNED, REVERSAL_PENDING, REVERSED]
    TransferRequest:
      type: object
      required: [sourceAccountId, destinationAccountId, amount, currency]
      properties:
        sourceAccountId: { type: string, minLength: 1, maxLength: 64 }
        destinationAccountId: { type: string, minLength: 1, maxLength: 64 }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reference: { type: string, maxLength: 140 }
    Transfer:
      type: object
      required: [transferId, status, amount, currency]
      properties:
        transferId: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        coreReference: { type: [string, 'null'] }
        correlationId: { type: [string, 'null'] }
        sourceAccountId: { type: string }
        destinationAccountId: { type: string }
        beneficiaryId: { type: string, format: uuid }
        beneficiaryName: { type: string }
        maskedDestinationAccount: { type: string }
        reference: { type: string }
        failureCode: { type: string }
        failureDetail: { type: string }
        receiptAvailable: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransferPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages, summary]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        summary: { $ref: '#/components/schemas/TransferSummary' }
    TransferSummary:
      type: object
      additionalProperties: false
      required: [total, settled, processing, riskReview, failed]
      properties:
        total: { type: integer, minimum: 0 }
        settled: { type: integer, minimum: 0 }
        processing: { type: integer, minimum: 0 }
        riskReview: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    TransferStateHistoryEntry:
      type: object
      required: [toStatus, actorType, actorId, createdAt]
      properties:
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/TransferStatus'
            - type: 'null'
        toStatus: { $ref: '#/components/schemas/TransferStatus' }
        reasonCode: { type: [string, 'null'] }
        actorType: { type: string }
        actorId: { type: string }
        createdAt: { type: string, format: date-time }
    OutboxEvent:
      type: object
      required: [eventId, eventType, status, attemptCount, createdAt, updatedAt]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { type: string }
        attemptCount: { type: integer, minimum: 0 }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransferDetail:
      allOf:
        - $ref: '#/components/schemas/Transfer'
        - type: object
          required: [stateHistory, outboxEvents, auditCount]
          properties:
            stateHistory: { type: array, items: { $ref: '#/components/schemas/TransferStateHistoryEntry' } }
            outboxEvents: { type: array, items: { $ref: '#/components/schemas/OutboxEvent' } }
            auditCount: { type: integer, minimum: 0 }
    MonitoringAlertResponse:
      type: object
      required: [alerts, count]
      properties:
        count: { type: integer, minimum: 0 }
        alerts:
          type: array
          items:
            type: object
            required: [code, severity, status]
            properties:
              code: { type: string, example: EOD_FAILED }
              severity: { type: string, enum: [P0, P1, P2] }
              status: { type: string, enum: [FIRING, RESOLVED] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
