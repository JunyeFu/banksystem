          - Portable runtime configuration uses CONTROL_* and VISION_* variables; real structured controller and screenshot vision probes pass without mocks or degraded fallback.
          - Plaintext credentials enter only the local capture form, are protected with Windows DPAPI CurrentUser, and all other layers use credentialRef.
          - Natural language, XLSX/CSV/DOCX/JSON and MP4/H.264 inputs accept governed supplementary images and converge on the same confirmed CaseDraft contract through twenty-three authenticated MCP tools.
