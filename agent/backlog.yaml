        title: Fail closed for EOD when authoritative status is unavailable
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [FE-PLAN-001]
        allowedPaths: [apps/operations-console/**, tests/e2e/frontend-operations-settlement/**, docs/evidence/**, agent/**]
        acceptance:
          - A failed or unavailable EOD status query disables both the start and confirm execution controls.
          - The UI provides an explicit retry path and never infers a business date or executable state from unavailable data.
          - Mocked and live-browser safety checks cover the failure branch without executing EOD.
      - id: FE-DEFECT-003
        title: Restore customer portal live read paths and recoverability
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [FE-PLAN-001]
        allowedPaths: [apps/customer-portal/**, services/**, contracts/**, tests/**, docs/evidence/**, agent/**]
        acceptance:
