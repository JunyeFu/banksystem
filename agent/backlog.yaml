        title: Platform-neutral deterministic regression engine completion
        status: DONE
        owner: 傅钧烨
        dependsOn: [HENGZHUN-DELIVERY-001]
        evidence: [docs/evidence/platform/hengzhun-i8-stage2-agentflow-mcp-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage3-deterministic-builder-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage4-stability-certificate-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage5-controlled-delivery-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage6-scheduling-inbox-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage7-restricted-repair-2026-07-21.md]
        allowedPaths: [platform/hengzhun-regression-system/**, docs/architecture/**, docs/control/**, docs/design/regression-platform/**, docs/current-state/**, docs/evidence/platform/**, agent/**]
        acceptance:
          - Portable Flowise artifacts target Flowise 3.0.12 on bundled Node 20.20.2; all declared platform-external operations use authenticated MCP tools and real platform publication is deferred to I9.
          - The artifact contract assigns natural language, semantic retrieval, case normalization, minimal clarification, intent planning, human input and result explanation to the Agent platform; local tools own authoritative state, deterministic execution, scripts, evidence and audit.
          - Visual and controller LLM requests both enforce a 16000-token total window with at most 12000 input tokens and at least 4000 reserved output tokens; MiMo v2.5 uses only the confirmed Qwen3.5-compatible non-thinking, non-streaming OpenAI Chat Completions JSON-string contract and never calls MCP natively.
          - Harness emits a strict ActionContextEnvelope, defaults to CTX-L1 and upgrades to CTX-L2/CTX-L3 only by deterministic insufficiency rules; the Worker demonstrably passes the complete governed envelope rather than only currentAction.prompt to the visual model adapter.
          - Migration 009 and audit records persist consumer, context level, estimated and provider-reported token usage, image estimate, tokenizer, budget decision and redaction profile reference without secret content; deterministic over-budget paths return the frozen visual/controller error codes.
          - Flowise platform knowledge, Flowise database.sqlite and Harness regression_platform.sqlite have separate authority, permissions, backup and restore paths with no domain-state or knowledge-body dual writes; repository RAG is development-only and no RAG subsystem exists in the product.
          - A plain-language login/profile consistency case produces a deterministic Playwright candidate through the limited DSL and passes the six-run StabilityCertificate gate.
          - Candidate preview, explicit activation, exact-version recurring and one-time schedules, offline result inbox and bounded repair all pass contract, migration, integration and browser E2E tests.
          - Every Flowise capability declared by the portable definition has an evidenced HiAgent mapping; local artifact or engine success is not reported as Flowise publication or HiAgent success.
