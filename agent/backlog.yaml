          - Identity readiness covers enabled/no-required-action state, default CUSTOMER role, unique customer_identity mapping and restart re-verification; phone-number login is not claimed until its contract exists.
          - Dashboard, security settings and transfer list consume contract-valid data in the local authenticated demo.
          - Each error state exposes safe retry and actionable, non-sensitive recovery feedback.
          - Root cause and remediation evidence distinguish client, gateway, authorization and downstream dependency failures.
