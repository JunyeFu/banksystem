  - id: PRIORITY-20260715
    name: internship-regression-platform-first
    workItems:
      - id: FE-DEFECT-001
        title: Frontend defect inventory, remediation and acceptance
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [FE-PLAN-001]
        allowedPaths: [apps/**, services/**, contracts/**, tests/**, docs/design/frontend/**, docs/evidence/**, agent/**]
        acceptance:
          - Current customer and operations frontend defects are recorded against real API contracts and split into independently verifiable batches.
          - The identified batches are fixed in scoped implementation work before this parent item is marked DONE.
          - Each changed flow passes relevant frontend build, contract, browser and visual acceptance checks.
          - No v5.4 Coze/Harness or 衡准 implementation is started in this item.
        evidence: [docs/evidence/frontend/frontend-defect-inventory-2026-07-15.md, docs/evidence/frontend/customer-live-read-remediation-2026-07-16.md]
      - id: FE-DEFECT-002
        title: Fail closed for EOD when authoritative status is unavailable
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [FE-PLAN-001]
        allowedPaths: [apps/operations-console/**, tests/e2e/frontend-operations-settlement/**, docs/evidence/**, agent/**]
        acceptance:
          - A failed or unavailable EOD status query disables both the start and confirm execution controls.
          - The UI provides an explicit retry path and never infers a business date or executable state from unavailable data.
          - Mocked and live-browser safety checks cover the failure branch without executing EOD.
      - id: FE-DEFECT-003
        title: Restore customer portal live read paths and recoverability
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [FE-PLAN-001]
        allowedPaths: [apps/customer-portal/**, services/**, contracts/**, tests/**, docs/evidence/**, agent/**]
        acceptance:
          - A persistent bank-customer identity completes user-entered graphical username/password login from /portal/login without exposing credentials, then reaches the customer dashboard and its uniquely linked core account.
          - Identity readiness covers enabled/no-required-action state, default CUSTOMER role, unique customer_identity mapping and restart re-verification; phone-number login is not claimed until its contract exists.
          - Dashboard, security settings and transfer list consume contract-valid data in the local authenticated demo.
          - Each error state exposes safe retry and actionable, non-sensitive recovery feedback.
          - Root cause and remediation evidence distinguish client, gateway, authorization and downstream dependency failures.
        evidence: [docs/evidence/frontend/customer-live-read-remediation-2026-07-16.md, docs/evidence/frontend/customer-password-login-gap-2026-07-16.md]
      - id: FE-DEFECT-004
        title: Restore operations console live read paths
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [FE-PLAN-001]
        allowedPaths: [apps/operations-console/**, services/**, contracts/**, tests/**, docs/evidence/**, agent/**]
        acceptance:
          - EOD and payment monitoring consume contract-valid data in the local authenticated demo.
          - Failures remain explicit and are not converted to a misleading empty state.
          - Remediation evidence identifies the responsible integration boundary without exposing credentials.
      - id: FE-DEFECT-005
        title: Add live frontend integration health gates
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [FE-DEFECT-002, FE-DEFECT-003, FE-DEFECT-004]
        allowedPaths: [tests/**, apps/**, services/**, contracts/**, docs/evidence/**, agent/**]
        acceptance:
          - A deterministic local smoke suite avoids page.route for the covered read paths.
          - It covers customer and operations reads, authorization/error recovery, and EOD fail-closed behavior.
          - Evidence is synthetic/redacted and captures contract version, route, status and assertion outcome.
      - id: FE-DEFECT-006
        title: Establish frontend performance budgets and route-level code splitting
        status: READY
        owner: 傅钧烨
        dependsOn: [FE-PLAN-001]
        allowedPaths: [apps/customer-portal/**, apps/operations-console/**, tests/**, docs/evidence/**, agent/**]
        acceptance:
          - Each portal has a documented and automated initial JavaScript budget.
          - Route-level splitting is introduced where necessary without weakening accessibility, visual acceptance or banking controls.
      - id: COZE-HARNESS-CORE-001
        title: Coze-only regression authoring and deterministic execution core
        status: DONE
        owner: 傅钧烨
        dependsOn: []
        evidence: [docs/evidence/platform/hengzhun-i1-platform-baseline-2026-07-16.md, docs/evidence/platform/hengzhun-i2-safe-kernel-2026-07-16.md, docs/evidence/platform/hengzhun-i4-three-case-midscene-2026-07-17.md, docs/evidence/platform/hengzhun-i5-import-repair-2026-07-17.md, docs/evidence/platform/hengzhun-i6-scheduling-offline-2026-07-18.md, platform/hengzhun-regression-system/tests/conformance/status.yaml]
        allowedPaths: [platform/**, contracts/**, tests/**, docs/architecture/**, docs/current-state/**, docs/evidence/**, documents/**, rag/**, agent/**, infra/**, scripts/platform/**]
        acceptance:
          - Platform runtime, Coze deployment, Harness OpenAPI, SQLite, Artifact and Worker foundations may start while unrelated frontend defects remain open.
          - Each bank case must pass its own route, API, role, fixture, stable-locator and redacted-browser-evidence gate before Harness integrates that case; one blocked case does not block platform foundations or other ready cases.
          - The internship minimum closes three low-risk cases: customer password login/profile consistency, customer account list/detail isolation, and safe rejection/recovery for invalid credentials, authorization or expired sessions.
          - Coze is the only user-facing authoring and task-control entry.
          - Harness provides the audited SQLite-backed tool boundary and deterministic Playwright execution.
          - Midscene is model-backed and risk-routed; formal schedules execute only validated Playwright scripts.
          - 衡准 UI implementation is excluded.
      - id: HENGZHUN-DELIVERY-001
        title: Hengzhun internship delivery freeze and reproducible acceptance
        status: DONE
        owner: 傅钧烨
        dependsOn: [COZE-HARNESS-CORE-001]
        evidence: [docs/evidence/platform/hengzhun-i7-internship-delivery-2026-07-18.md]
        allowedPaths: [platform/hengzhun-regression-system/**, docs/current-state/**, docs/evidence/platform/**, agent/**, rag/**]
        acceptance:
          - The internship delivery scope is frozen without expanding bank business or Hengzhun UI.
          - One command verifies I1-I7 and writes a redacted machine-readable acceptance record.
          - A clean source commit produces a complete three-image offline package and restores it into a fresh directory.
          - SQLite integrity, schema version, package hashes, SBOM and source commit binding are verified.
          - This conversation stops at the verified local demonstration; target-tenant capacity and target-HiAgent networking are handed off to a separate future conversation.
      - id: HENGZHUN-I8-FLOWISE-001
        title: Flowise and SQLite deterministic regression completion
        status: IN_PROGRESS
        owner: 傅钧烨
        dependsOn: [HENGZHUN-DELIVERY-001]
        evidence: [docs/evidence/platform/hengzhun-i8-stage2-agentflow-mcp-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage3-deterministic-builder-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage4-stability-certificate-2026-07-20.md, docs/evidence/platform/hengzhun-i8-stage5-controlled-delivery-2026-07-20.md]
        allowedPaths: [platform/hengzhun-regression-system/**, docs/architecture/**, docs/control/**, docs/design/regression-platform/**, docs/current-state/**, docs/evidence/platform/**, agent/**]
        acceptance:
          - Flowise 3.0.12 on bundled Node 20.20.2 is the only personal and office computer Agent platform; all platform-external operations use authenticated MCP tools.
          - Flowise handles natural language, semantic retrieval, case normalization, minimal clarification, intent planning, human input and result explanation; local tools handle authoritative state, deterministic execution, scripts, evidence and audit.
          - Visual LLM requests enforce a 16000-token total window with at most 12000 input tokens and at least 4000 reserved output tokens; controller LLM requests enforce a 1000000-token total window with at most 967232 input tokens and at least 32768 reserved output tokens, without broadening data authorization.
          - Harness emits a strict ActionContextEnvelope, defaults to CTX-L1 and upgrades to CTX-L2/CTX-L3 only by deterministic insufficiency rules; the Worker demonstrably passes the complete governed envelope rather than only currentAction.prompt to the visual model adapter.
          - Migration 009 and audit records persist consumer, context level, estimated and provider-reported token usage, image estimate, tokenizer, budget decision and redaction profile reference without secret content; deterministic over-budget paths return the frozen visual/controller error codes.
          - Flowise platform knowledge, Flowise database.sqlite and Harness regression_platform.sqlite have separate authority, permissions, backup and restore paths with no domain-state or knowledge-body dual writes; repository RAG is development-only and no RAG subsystem exists in the product.
          - A plain-language login/profile consistency case produces a deterministic Playwright candidate through the limited DSL and passes the six-run StabilityCertificate gate.
          - Candidate preview, explicit activation, exact-version recurring and one-time schedules, offline result inbox and bounded repair all pass contract, migration, integration and browser E2E tests.
          - Every Flowise capability used by the portable definition has an evidenced HiAgent mapping; Flowise success is not reported as HiAgent success.
      - id: HENGZHUN-POST-I8-INPUTS-001
        title: External case adapters and video-case authoring extensions
        status: PROPOSED
        owner: 傅钧烨
        dependsOn: [HENGZHUN-I8-FLOWISE-001]
        allowedPaths: [platform/hengzhun-regression-system/**, contracts/**, docs/architecture/**, docs/control/**, docs/design/regression-platform/**, docs/evidence/platform/**, agent/**]
        acceptance:
          - Playwright, Selenium, Cypress, Postman and Gherkin imports preserve source, version, normalized intent and unsupported semantics without executing untrusted source directly.
          - Video inputs are processed locally into redacted, reviewable action candidates and never sent to the Agent platform as raw sensitive media.
          - Imported or video-derived candidates pass the same Harness, Midscene, deterministic Builder, six-run Playwright stability and explicit-activation gates as natural-language cases.
      - id: HZ-OBSERVABILITY-001
        title: Hengzhun read-only observability implementation
        status: BLOCKED
        owner: 傅钧烨
        dependsOn: [COZE-HARNESS-CORE-001]
        allowedPaths: [platform/**, apps/**, contracts/**, tests/**, docs/**, agent/**]
        acceptance:
          - Deferred by project-owner decision; no implementation work is authorized until explicitly resumed.

