schemaVersion: 2
project: banksystem
root: 'D:\Agent\banksystem'
defaultBranch: main
spec: v4-stage1
constraints:
  preserveExistingCore: true
  directWriteToFineractDatabase: false
  exposeDatabasePortsToHost: false
  realMoney: false
  tenant: default
qualityGates:
  contractLint: true
  unitTests: true
  integrationTests: true
  e2eForMoneyChange: true
  reconciliationAssertion: true
  securityReview: true

phases:
  - id: S0
    name: baseline-governance
    tasks:
      - id: S0-T1
        title: Freeze versions, images, and digests
        owner: BaselineAgent
        status: DONE
        dependsOn: []
        allowedPaths: [infra/versions.lock.yaml, infra/images.lock.txt]
        outputs: [infra/versions.lock.yaml, infra/images.lock.txt]
        acceptance: [No latest tag, All images have sha256 digest, versions.lock.yaml has schemaVersion 2]
      - id: S0-T2
        title: Document port, network, and volume baseline
        owner: BaselineAgent
        status: DONE
        dependsOn: [S0-T1]
        allowedPaths: [docs/baseline/**]
        outputs: [docs/baseline/port-network-volume-map.md]
        acceptance: [All v4 ports documented, All networks mapped, S1 migration items listed]
      - id: S0-T3
        title: Author 5 architecture decision records
        owner: BaselineAgent
        status: DONE
        dependsOn: []
        allowedPaths: [docs/architecture/**]
        outputs: [docs/architecture/adr-001-fineract-sole-truth-source.md, docs/architecture/adr-002-modular-monolith.md, docs/architecture/adr-003-no-customer-direct-fineract.md, docs/architecture/adr-004-deterministic-money-ops.md, docs/architecture/adr-005-testability-first-class.md]
        acceptance: [5 ADRs with Status/Context/Decision/Consequences/Alternatives, All v4 ADR content covered]
      - id: S0-T4
        title: Establish Monorepo directory skeleton
        owner: BaselineAgent
        status: DONE
        dependsOn: []
        allowedPaths: ['**']
        outputs: [packages/**, tests/**, contracts/schemas/**, contracts/catalogs/**, contracts/fixtures/**, infra/postgres/**, infra/activemq/**, infra/observability/**, scripts/dev/**, scripts/recovery/**, docs/api/**, docs/database/**, docs/security/**, docs/runbooks/**]
        acceptance: [All v4 section 4 directories exist, Directories renamed to v4 naming, .gitkeep in each new directory]
      - id: S0-T5
        title: Define file ownership and Agent task boundaries
        owner: BaselineAgent
        status: DONE
        dependsOn: [S0-T4]
        allowedPaths: [agent/**]
        outputs: [agent/file-ownership.yaml]
        acceptance: [All v4 section 26 owners defined, Cross-ownership rules documented, Forbidden paths per owner]
      - id: S0-T6
        title: Create acceptance matrix, risk register, and rollback principles
        owner: BaselineAgent
        status: DONE
        dependsOn: [S0-T1, S0-T2, S0-T3, S0-T4, S0-T5]
        allowedPaths: [docs/architecture/**, docs/baseline/**]
        outputs: [docs/architecture/acceptance-matrix.md, docs/baseline/risk-register.md, docs/architecture/rollback-principles.md]
        acceptance: [S0-S7 exit conditions defined, 12 risks registered, Rollback procedures for stage/date/money/db/config]
      - id: S0-T7
        title: Reset Agent scheduler and execution state for S0-S7
        owner: BaselineAgent
        status: DONE
        dependsOn: [S0-T1, S0-T2, S0-T3, S0-T4, S0-T5, S0-T6]
        allowedPaths: [agent/**]
        outputs: [agent/backlog.yaml, agent/execution-state.yaml, agent/AGENTS.md]
        acceptance: [backlog uses S0-S7 structure, execution-state reset to pending, AGENTS.md updated with S0-S7 rules]

  - id: S1
    name: platform-identity-trust
    tasks:
      - id: S1-T1
        title: Compose, networks, volumes, healthchecks, secrets, image locks
        owner: PlatformAgent
        status: PENDING
        dependsOn: [S0-T7]
        allowedPaths: [infra/**, compose.channel.yaml, .env.example]
        acceptance: [docker compose up succeeds from clean, All ports bind 127.0.0.1, No latest tags, Secrets via files not env]
      - id: S1-T2
        title: Gateway, Channel PG, ActiveMQ, Keycloak, Mock Clearing, Stubs, Observability infra
        owner: PlatformAgent
        status: PENDING
        dependsOn: [S1-T1]
        allowedPaths: [infra/**]
        acceptance: [All services healthy, Gateway proxies correctly, Observability infra running]
      - id: S1-T3
        title: bank-customer and bank-internal Realms with all 11 roles
        owner: PlatformAgent
        status: PENDING
        dependsOn: [S1-T2]
        allowedPaths: [infra/keycloak/**]
        acceptance: [Both realms import successfully, All 11 v4 roles present, Clients configured with PKCE]
      - id: S1-T4
        title: RBAC for Customer, Teller, Customer Service, Loan Officer/Approver, Payment Operator/Approver, Risk Analyst, Accountant, Auditor, System Admin
        owner: PlatformAgent
        status: PENDING
        dependsOn: [S1-T3]
        allowedPaths: [infra/keycloak/**]
        acceptance: [Each role has correct permissions, Backend enforces roles, Frontend hides match backend]
      - id: S1-T5
        title: Access boundaries for Customer Portal, Operations Console, Mifos X
        owner: PlatformAgent
        status: PENDING
        dependsOn: [S1-T4]
        allowedPaths: [infra/gateway/**]
        acceptance: [Browser cannot reach Fineract/DB/Broker directly, Maker-Checker truly separated]

  - id: S2
    name: core-adapter-contracts
    tasks:
      - id: S2-T1
        title: Fineract Adapter - tenant, auth, correlation, error mapping, retry, idempotency
        owner: CoreIntegrationAgent
        status: PENDING
        dependsOn: [S1-T2]
        allowedPaths: [services/bank-channel-service/src/**/fineract/**]
        acceptance: [All core calls go through adapter, No direct URL construction, Idempotency-Key enforced, Errors mapped to Problem Details]
      - id: S2-T2
        title: OpenAPI, AsyncAPI, JSON Schema, Problem Details, Money model
        owner: CoreIntegrationAgent
        status: PENDING
        dependsOn: [S2-T1]
        allowedPaths: [contracts/**]
        acceptance: [OpenAPI lint passes, AsyncAPI lint passes, Money as string not number, Problem Details RFC 7807]
      - id: S2-T3
        title: Liquibase channel tables - payment, state history, idempotency, outbox/inbox, audit, risk, notification, reconciliation
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S1-T2]
        allowedPaths: [services/bank-channel-service/src/main/resources/db/**]
        acceptance: [All v4 section 8 tables created, Constraints match v4, Indexes present, version column on mutable tables]
      - id: S2-T4
        title: State machine, optimistic lock, audit hash chain, unified error, tracing context
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S2-T3]
        allowedPaths: [services/bank-channel-service/src/**/common/**]
        acceptance: [Transfer state machine matches v4 section 10, Hash chain unbroken, Correlation ID propagated]
      - id: S2-T5
        title: Modular monolith layering - Controller -> Service -> Domain -> Repository/Adapter
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S2-T1, S2-T3, S2-T4]
        allowedPaths: [services/bank-channel-service/src/**]
        acceptance: [No Controller calls Repository directly, No direct Fineract URL construction, Transaction boundary in Service]

  - id: S3
    name: three-clients
    tasks:
      - id: S3-T1
        title: Customer Portal - login, dashboard, accounts, beneficiaries, transfers, loans, documents, messages, profile, security
        owner: CustomerFrontendAgent
        status: PENDING
        dependsOn: [S2-T5]
        allowedPaths: [apps/customer-portal/**, packages/bank-ui-kit/**, packages/bank-api-client/**]
        acceptance: [14 routes per v4 13.1, data-page-id on all pages, React/TypeScript/Vite, TanStack Query, React Hook Form + Zod]
      - id: S3-T2
        title: Staff Portal - retain and configure Mifos X for client/account/loan/teller/approval/accounting/config
        owner: PlatformAgent
        status: PENDING
        dependsOn: [S1-T5]
        allowedPaths: [infra/**]
        acceptance: [Mifos X accessible at 127.0.0.1:18080, Staff operations work manually]
      - id: S3-T3
        title: Operations Console - payment monitoring, risk review, approvals, clearing, reconciliation, EOD, audit, system health
        owner: OperationsFrontendAgent
        status: PENDING
        dependsOn: [S2-T5]
        allowedPaths: [apps/operations-console/**, packages/bank-domain-types/**]
        acceptance: [12 routes per v4 14, Approval pages show creator/status/impact/risk/before-after/audit/review-reason, React/TypeScript/Vite]
      - id: S3-T4
        title: Unified React/TypeScript frontend spec - routing, Query, forms, Zod, error boundaries, UI state, API client
        owner: CustomerFrontendAgent
        status: PENDING
        dependsOn: [S3-T1, S3-T3]
        allowedPaths: [packages/**]
        acceptance: [Shared packages built, API client centralized, No direct fetch in pages, Strict TypeScript]

  - id: S4
    name: banking-closure
    tasks:
      - id: S4-T1
        title: Customer and account - identity mapping, savings, account status, beneficiaries, documents, notifications
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S2-T5]
        allowedPaths: [services/bank-channel-service/src/**/customer/**, services/bank-channel-service/src/**/account/**, services/bank-channel-service/src/**/beneficiary/**, services/bank-channel-service/src/**/document/**, services/bank-channel-service/src/**/notification/**]
        acceptance: [Identity mapping verified, Account status managed, Beneficiary tokenized, Documents uploaded, Notifications sent]
      - id: S4-T2
        title: Internal payment - validation, risk, reservation, core posting, receipt, notification, outbox, reconciliation
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S4-T1, S2-T4]
        allowedPaths: [services/bank-channel-service/src/**/payment/**]
        acceptance: [Full transfer lifecycle, Idempotency replay returns same result, Insufficient funds -> FAILED, Reversal via state machine]
      - id: S4-T3
        title: Mock cross-bank - success, delayed, reject, timeout, return, duplicate, out-of-order callbacks
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S4-T2]
        allowedPaths: [services/mock-clearing-service/**, services/bank-channel-service/src/**/payment/**]
        acceptance: [All 8 v4 section 20 scenarios pass, Callbacks signed and idempotent, Compensation for each failure mode]
      - id: S4-T4
        title: Risk/KYC/AML simulation, manual review, Maker-Checker, reversal and compensation
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S4-T2]
        allowedPaths: [services/bank-channel-service/src/**/risk/**]
        acceptance: [Risk review flow, Maker cannot self-check, Independent approver required, Reversal produces new record]
      - id: S4-T5
        title: Loan lifecycle - application, documents, scoring, approval, disbursement, repayment, overdue, close
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S4-T1]
        allowedPaths: [services/bank-channel-service/src/**/loanapplication/**, services/bank-channel-service/src/**/risk/**]
        acceptance: [Complete loan lifecycle, Scoring deterministic, Maker-Checker on approval, Fineract reports Closed with zero outstanding]
      - id: S4-T6
        title: Accounting, general ledger, CHANNEL_TO_CORE and CHANNEL_TO_CLEARING reconciliation
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S4-T2, S4-T3]
        allowedPaths: [services/bank-channel-service/src/**/reconciliation/**]
        acceptance: [Debit equals credit, All three reconciliation types return MATCHED with zero differences]
      - id: S4-T7
        title: EOD - pending payment check, reconciliation, COB, interest/fees/overdue, accounting balance, audit checkpoint, date advance
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S4-T6]
        allowedPaths: [services/bank-channel-service/src/**/reconciliation/**]
        acceptance: [EOD standard order per v4 21, Any step failure does not advance date, All steps complete successfully]

  - id: S5
    name: testability-foundation
    tasks:
      - id: S5-T1
        title: Page stable contract - data-page-id, data-page-state, data-testid, role, label, ARIA, loading/error/business states
        owner: TestabilityAgent
        status: PENDING
        dependsOn: [S3-T1, S3-T3]
        allowedPaths: [apps/**, contracts/catalogs/**]
        acceptance: [All key pages have data-page-id, All key interactions have data-testid, Error states DOM-readable]
      - id: S5-T2
        title: Fixed demo profile - zh-CN, Shanghai TZ, 1440x900, reduced motion, no tours/tips, fixed business date
        owner: TestabilityAgent
        status: PENDING
        dependsOn: [S5-T1]
        allowedPaths: [apps/**, services/bank-channel-service/src/**/testsupport/**]
        acceptance: [Profile settings match v4 section 15, Profile does not bypass auth or business rules]
      - id: S5-T3
        title: Page Catalog, Action Catalog, Assertion Catalog
        owner: TestabilityAgent
        status: PENDING
        dependsOn: [S5-T1]
        allowedPaths: [contracts/catalogs/**]
        acceptance: [Catalogs match real routes and DOM, Versioned, Lintable]
      - id: S5-T4
        title: Fixture Registry with logical references
        owner: TestabilityAgent
        status: PENDING
        dependsOn: [S5-T3]
        allowedPaths: [contracts/fixtures/**]
        acceptance: [Fixtures use logical refs not runtime IDs, Seed API returns runtime IDs, Reset clears all test data]
      - id: S5-T5
        title: Test Support API - fixture seed/reset/query, page facts, payment/ledger/reconciliation assertions, business date advance
        owner: TestabilityAgent
        status: PENDING
        dependsOn: [S5-T4]
        allowedPaths: [services/bank-channel-service/src/**/testsupport/**, contracts/openapi/test-support-api.yaml]
        acceptance: [Only local/test profiles, TEST_SUPPORT authority required, No secret leakage, No Fineract DB writes, No state machine bypass]

  - id: S6
    name: observability-recovery-security
    tasks:
      - id: S6-T1
        title: Structured logs, Request ID, Correlation ID, metrics, tracing, health checks, alerts
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S4-T7]
        allowedPaths: [services/bank-channel-service/src/**/common/**, infra/observability/**]
        acceptance: [Logs structured per v4 22, All 7 metrics present, Health checks for all services]
      - id: S6-T2
        title: Outbox/DLQ/reconciliation diff/core dependency/EOD failure monitoring
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S6-T1]
        allowedPaths: [services/bank-channel-service/src/**, infra/observability/**]
        acceptance: [Alert verification for each failure mode, Alert severity assigned]
      - id: S6-T3
        title: Core and Channel backup, temporary target recovery drill, post-restore invariant verification
        owner: BankingDomainAgent
        status: PENDING
        dependsOn: [S6-T2]
        allowedPaths: [scripts/backup/**, scripts/recovery/**]
        acceptance: [Backup SHA-256 exists, Restore to temp target, Invariants verified: balance/mapping/audit/order/reconciliation]
      - id: S6-T4
        title: Test suite - unit, contract, integration, accessibility, permission, money, accounting, reconciliation, recovery
        owner: TestabilityAgent
        status: PENDING
        dependsOn: [S6-T3]
        allowedPaths: [tests/**]
        acceptance: [All test types pass, E2E-001~012 pass, Money scenarios assert HTTP/status/history/idempotency/balance/accounting/outbox/notification/audit/reconciliation]
      - id: S6-T5
        title: Security review - secret leakage, direct core DB write, permission bypass, frontend token storage, image/dependency risks
        owner: SecurityReviewer
        status: PENDING
        dependsOn: [S6-T4]
        allowedPaths: [docs/security/**]
        acceptance: [No secret in logs, No direct Fineract DB write, No permission bypass, No token in localStorage, No known critical CVE]

  - id: S7
    name: final-acceptance
    tasks:
      - id: S7-T1
        title: Three clients acceptance verification
        owner: Stage1Reviewer
        status: PENDING
        dependsOn: [S6-T5]
        allowedPaths: [docs/evidence/**]
        acceptance: [Customer Portal accessible, Operations Console accessible, Mifos X accessible]
      - id: S7-T2
        title: Business closure acceptance - customer/account/transfer/loan/accounting/EOD
        owner: Stage1Reviewer
        status: PENDING
        dependsOn: [S7-T1]
        allowedPaths: [docs/evidence/**]
        acceptance: [All business flows complete, Repeatable closure]
      - id: S7-T3
        title: Core truth source verification - Fineract sole source
        owner: Stage1Reviewer
        status: PENDING
        dependsOn: [S7-T2]
        allowedPaths: [docs/evidence/**]
        acceptance: [ADR-001 compliance, No direct DB writes, Reconciliation confirms]
      - id: S7-T4
        title: Test contract and Catalog acceptance
        owner: Stage1Reviewer
        status: PENDING
        dependsOn: [S7-T3]
        allowedPaths: [docs/evidence/**]
        acceptance: [Page/Action/Assertion Catalog complete, Fixture Registry versioned]
      - id: S7-T5
        title: Fixture, security, audit, reconciliation, recovery, money E2E, accounting balance acceptance
        owner: Stage1Reviewer
        status: PENDING
        dependsOn: [S7-T4]
        allowedPaths: [docs/evidence/**]
        acceptance: [Seed/Reset repeatable 3x, All security checks pass, Audit chain intact, All E2E pass]
      - id: S7-T6
        title: Human review and evidence archive
        owner: Stage1Reviewer
        status: PENDING
        dependsOn: [S7-T5]
        allowedPaths: [docs/evidence/**, docs/runbooks/**]
        acceptance: [Architecture review signed off, Security review signed off, Accounting review signed off, Recovery review signed off, All evidence archived, No unresolved MUST items]
