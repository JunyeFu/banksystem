schemaVersion: 1
updatedAt: '2026-07-11T00:00:00+08:00'
spec: v4-stage1

owners:
  - id: BaselineAgent
    owns:
      - docs/baseline/**
      - scripts/baseline/**
      - infra/versions.lock.yaml
      - infra/images.lock.txt
    forbidden:
      - services/**
      - apps/**
      - contracts/**

  - id: PlatformAgent
    owns:
      - infra/**
      - compose.channel.yaml
      - .env.example
    forbidden:
      - services/bank-channel-service/src/**/db/**
      - apps/**

  - id: CoreIntegrationAgent
    owns:
      - services/bank-channel-service/src/**/fineract/**
    forbidden:
      - apps/**
      - services/bank-channel-service/src/**/payment/**
      - services/bank-channel-service/src/**/loanapplication/**

  - id: CustomerFrontendAgent
    owns:
      - apps/customer-portal/**
      - packages/bank-ui-kit/**
      - packages/bank-api-client/**
    forbidden:
      - services/**
      - infra/**
      - db/changelog/**

  - id: OperationsFrontendAgent
    owns:
      - apps/operations-console/**
      - packages/bank-domain-types/**
    forbidden:
      - services/**
      - infra/**
      - db/changelog/**

  - id: BankingDomainAgent
    owns:
      - services/bank-channel-service/src/**/payment/**
      - services/bank-channel-service/src/**/loanapplication/**
      - services/bank-channel-service/src/**/reconciliation/**
      - services/bank-channel-service/src/**/risk/**
      - services/bank-channel-service/src/**/account/**
      - services/bank-channel-service/src/**/customer/**
      - services/bank-channel-service/src/**/beneficiary/**
      - services/bank-channel-service/src/**/notification/**
      - services/bank-channel-service/src/**/document/**
      - services/bank-channel-service/src/**/audit/**
      - services/bank-channel-service/src/**/identity/**
      - services/bank-channel-service/src/**/common/**
      - services/bank-channel-service/src/main/resources/db/**
      - services/mock-clearing-service/**
    forbidden:
      - apps/**
      - infra/**

  - id: TestabilityAgent
    owns:
      - contracts/catalogs/**
      - contracts/fixtures/**
      - contracts/openapi/test-support-api.yaml
      - services/bank-channel-service/src/**/testsupport/**
      - tests/**
    forbidden:
      - services/bank-channel-service/src/**/fineract/**
      - services/bank-channel-service/src/**/payment/** (logic only; test hooks allowed)

  - id: SecurityReviewer
    owns:
      - docs/security/**
    forbidden:
      - All implementation code (read-only reviewer)

  - id: Stage1Reviewer
    owns:
      - docs/evidence/**
      - docs/runbooks/**
    forbidden:
      - All implementation code (read-only reviewer)

crossOwnershipRules:
  - rule: 'Any modification outside owned paths MUST be documented in agent/reports/ with reason and impact.'
  - rule: 'Frontend Agent MUST NOT modify database migrations.'
  - rule: 'Database Agent MUST NOT modify frontend.'
  - rule: 'Fineract Adapter has a single dedicated owner (CoreIntegrationAgent).'
  - rule: 'Test Support API is only enabled under local/test profiles.'
  - rule: 'Security changes require SecurityReviewer sign-off.'
  - rule: 'Money-related changes require BankingDomainAgent and Stage1Reviewer sign-off.'
