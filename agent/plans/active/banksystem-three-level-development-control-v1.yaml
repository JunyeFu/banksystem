schemaVersion: 1
controlId: BANKSYSTEM-OSS-THREE-LEVEL-V1
title: Open-source bank and CLI Agent three-level development control
effectiveDate: '2026-08-30'
authorities:
  implementationOrder: agent/plans/active/v54-implementation-batches.md
  taskStatus: agent/backlog.yaml
  productBaseline: agent/plans/active/banksystem-open-source-product-baseline-v1.md
  portfolio: agent/plans/active/banksystem-open-source-task-packages-v1.yaml
  contracts: contracts/
layerMapping:
  large:
    name: A package
    unit: A01-A08 product outcome
    transition: all medium packages satisfy their completion gates
  medium:
    name: RF capability package
    unit: one business capability and one change axis
    requiredArtifact: docs/architecture/refactoring/batches/RF-xxx/batch.yaml
    transition: all small packages are reviewed and batch evidence is accepted
  small:
    name: executable task package
    unit: one 1-3 day observable outcome
    requiredArtifacts: [slices/Sx.yaml, tasks/RF-xxx-Sx.md]
    transition: command-level done conditions pass and evidence is reviewed
rules:
  maxActiveSmallPackages: 1
  noParallelRoadmap: true
  visualApprovalBeforeUiReady: true
  visualImageIsNotContract: true
  firstDeterministicFailure: STOP
  statusFieldsInThisFile: planning-only
  runtimeFallback: NONE

businessKnowledge:
  BR-01: Fineract is the sole source for accounts, balances and transactions.
  BR-02: Bank browser traffic follows Portal -> Gateway -> Bank Channel -> Fineract API.
  BR-03: Harness SQLite is the sole Journey, Run, evidence and release-state authority.
  BR-04: Flowise, Coze and HiAgent are historical evidence, never runtime or fallback dependencies.
  BR-05: Money writes require decimal amounts, idempotency key, correlation ID and accounting assertions.
  BR-06: Customer and operations views must resolve the same transaction and correlation ID.
  BR-07: The CLI uses one configured OpenAI-compatible BYOK model and fails explicitly when it is unavailable.
  BR-08: STATIC, CONTRACT, INTEGRATION, LIVE_E2E, HUMAN_ACCEPTED and RELEASED are non-substitutable evidence levels.
  BR-09: Source, contract, artifact, model binding or formal-suite drift freezes a new ReleaseIdentity.
  BR-10: Quality Portal is a loopback, redacted, GET-only projection and never a second control plane.

projectPitfalls:
  PF-01: Healthy containers do not prove login, transfer, ledger consistency or Agent execution.
  PF-02: Host dist folders, absolute developer paths and frontend mocks break fresh-clone reproducibility.
  PF-03: Direct database seeding can fabricate bank outcomes and is forbidden.
  PF-04: A generated API client can retain removed write operations unless regenerated and consumer-checked.
  PF-05: Model prompts, logs, screenshots and evidence can leak credentials or customer data.
  PF-06: A model-authored Journey is not executable until validation and explicit approval complete.
  PF-07: Continuing a failed formal suite under the old identity can create a false release result.
  PF-08: AI-generated UI text and pixels are design discussion material, not executable acceptance truth.
  PF-09: A terminal mock or recorded screenshot is not proof that Worker and browser acted on the live page.
  PF-10: Git push, green unit tests and local build output are not LIVE_E2E or release approval.

implementationTemplates:
  IT-01-RUNTIME:
    shape: prepare -> up -> status -> run-golden-path -> verify -> down
    required: [explicit prerequisites, project-owned processes, named volumes, stable exit codes]
    verify: [Compose config, image build, empty-volume start, cold restart]
  IT-02-BANK-COMMAND:
    request: '{correlationId, idempotencyKey, sourceAccountId, targetAccountId, amount, currency}'
    response: '{journeyId, correlationId, sourceAccountId, targetAccountId, amount, currency, fineractTransactionId, status}'
    verify: [balance conservation, duplicate-submit idempotency, customer/operations agreement]
  IT-03-PORTAL-PAGE:
    flow: route -> generated typed client -> explicit loading/error/empty/ready state -> accessible Ant Design view
    constraints: [no direct Fineract call, no runtime mock, no embedded service token]
    verify: [lint, typecheck, unit, build, browser screenshot, console clean]
  IT-04-QUALITY-PROJECTION:
    flow: Harness SQLite -> redacted projection mapper -> GET-only /api/quality/v1 -> Quality Portal
    constraints: [loopback only, no mutation verb, same ReleaseIdentity]
    verify: [OpenAPI, producer test, consumer test, browser read-only assertion]
  IT-05-CLI-COMMAND:
    flow: parse -> prerequisite check -> Controller/MCP request -> authoritative Harness readback -> stable output and exit code
    exitCodes: {success: 0, usage: 2, dependency: 3, execution: 4, releaseGate: 5}
    constraints: [no broad retry, no alternate model, no plaintext credential]
  IT-06-EVIDENCE:
    record: '{releaseIdentity, journeyId, runId, correlationId, artifactType, path, sha256, decision}'
    constraints: [append-only ledger, redacted artifacts, validator-owned GO decision]
    verify: [hash replay, missing-artifact failure, identity mismatch failure]
  IT-07-CI:
    flow: contracts -> Java -> frontends -> CLI platform -> Compose smoke -> browser E2E -> security/SBOM
    constraints: [empty database, deterministic CI-only model, no user BYOK secret]
  IT-08-RELEASE:
    contents: [source archive, checksums, SBOM, ReleaseIdentity summary, known limitations, demo script]
    verify: [Full18 18/18, cold replay, CI green, human acceptance]

visualConfirmation:
  protocol:
    - Generate exactly one preview for the current question.
    - Present the image together with observable functions and explicit non-functions.
    - Accept an explicit CONFIRM, an explicit request to advance, or a concrete REVISION request from the project owner.
    - Record the answer before generating the next question.
    - Regenerate only the current question when revision is requested.
  answerSyntax:
    confirm: '确认 VQ-xx or 继续 while one question is current'
    revise: '修改 VQ-xx：<changes>'
  questions:
    - {order: 1, id: VQ-01, title: Product combination and visual language, planningState: CONFIRMED, candidateImage: docs/design/visual-acceptance/banksystem-v1/vq-01-product-combination-v1.png, sha256: b4055244a2febe7dcad91f3d56c7407036595d8a818df4c3d85dd085adedc6cb, ownerDecision: '继续', interpretedAs: CONFIRMED_AND_ADVANCE, confirmedAt: '2026-08-30T21:28:19+08:00', gates: [A03-M03, A04-M02, A05-M03, A08-M02]}
    - {order: 2, id: VQ-02, title: Customer login and account overview, planningState: CONFIRMED, candidateImage: docs/design/visual-acceptance/banksystem-v1/vq-02-customer-login-account-overview-v2.png, sha256: ce153c4cb3ca33bdff4fe1edd9648af883d37204e5a1df0c6c73599cabf77974, revisionRequest: '按已实现页面的风格为蓝图生成预览图', ownerDecision: '确认1VQ-02', interpretedAs: CONFIRMED, normalizationNote: 'single extraneous digit between confirmation verb and question id', confirmedAt: '2026-08-30T22:04:48+08:00', referenceBaselines: [tests/e2e/frontend-customer-core/snapshots/PV-0006.png, tests/e2e/frontend-customer-core/snapshots/PV-0010.png, tests/e2e/frontend-customer-core/snapshots/PV-0018.png], gates: [A03-M03-S01]}
