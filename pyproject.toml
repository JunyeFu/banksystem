[project]
name = "banksystem-tooling"
version = "0.1.0"
description = "Local Python tooling for the banksystem documentation, knowledge, RAG, and mock-service workflows."
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask==3.1.1",
    "gunicorn==23.0.0",
    "pypdf>=5.9.0,<7",
    "python-docx>=1.2.0,<2",
    "pyyaml>=6.0.2,<7",
    "reportlab>=4.4.0,<5",
]

[tool.uv]
package = false
