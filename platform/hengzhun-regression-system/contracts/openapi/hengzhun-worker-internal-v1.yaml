openapi: 3.0.3
info:
  title: 衡准 Worker 内部接口
  version: 1.2.0
  description: 仅供本机 Playwright/Midscene Worker 领取和完成 SQLite 持久化任务，不导入 Coze/HiAgent。
servers:
  - url: http://127.0.0.1:18788
security:
  - workerBearer: []
paths:
  /internal/worker/tasks:claim:
    post:
      operationId: workerClaimTask
      summary: 领取一个带租约的正式回归任务
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerClaimRequest'}
            example: {workerId: worker-local-01}
      responses:
        '200':
          description: 已领取任务或当前队列为空
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /internal/worker/tasks/{taskId}:complete:
    post:
      operationId: workerCompleteTask
      summary: 提交确定性断言结果和受控证据
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string, minLength: 8, maxLength: 80}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerCompletionRequest'}
      responses:
        '200':
          description: 任务和运行状态已原子更新
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /internal/worker/authoring:claim:
    post:
      operationId: workerClaimAuthoringAction
      summary: 领取一个受三动作窗口约束的作者化动作
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerClaimRequest'}
      responses:
        '200':
          description: 已领取单动作租约或当前队列为空
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /internal/worker/authoring/{taskId}/actions:complete:
    post:
      operationId: workerCompleteAuthoringAction
      summary: 提交 Playwright 独立验证后的作者化动作结果
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string, minLength: 8, maxLength: 80}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthoringActionCompletionRequest'}
      responses:
        '200':
          description: 动作状态与游标已原子处理
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /internal/worker/midscene-capabilities:record:
    post:
      operationId: workerRecordMidsceneCapability
      summary: 记录 PLAT-V014 原子动作稳定性门禁结果
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MidsceneCapabilityRequest'}
      responses:
        '200':
          description: 动作能力已按零失败规则更新
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /internal/worker/repairs:claim:
    post:
      operationId: workerClaimRepairValidation
      summary: 领取一个隔离修复候选验证租约
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerClaimRequest'}
      responses:
        '200':
          description: 返回白名单脚本、受控配置和全新浏览器上下文隔离要求，或队列为空
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /internal/worker/repairs/{jobId}:complete:
    post:
      operationId: workerCompleteRepairValidation
      summary: 提交隔离 Playwright 候选验证结果
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {type: string, minLength: 8, maxLength: 80}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerCompletionRequest'}
      responses:
        '200':
          description: 候选进入 WAITING_USER 或 VALIDATION_FAILED；不会自动激活脚本
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    workerBearer: {type: http, scheme: bearer, bearerFormat: opaque-worker-token}
  schemas:
    WorkerClaimRequest:
      type: object
      additionalProperties: false
      required: [workerId]
      properties:
        workerId: {type: string, minLength: 3, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    WorkerEvidence:
      type: object
      additionalProperties: false
      required: [artifactType, mediaType, redactionStatus, extension, base64Content]
      properties:
        artifactType: {type: string, enum: [JSON, TEXT, SCREENSHOT, LOG, REPORT, DIAGNOSTIC]}
        mediaType: {type: string, minLength: 1, maxLength: 128}
        redactionStatus: {type: string, enum: [NOT_REQUIRED, REDACTED, QUARANTINED]}
        extension: {type: string, minLength: 1, maxLength: 10, pattern: '^[A-Za-z0-9]+$'}
        base64Content: {type: string, minLength: 1, description: Base64 编码且不得包含凭据或真实个人信息。}
        metadata: {type: object, additionalProperties: true}
    WorkerCompletionRequest:
      type: object
      additionalProperties: false
      required: [workerId, outcome, summary, evidence]
      properties:
        workerId: {type: string, minLength: 3, maxLength: 128}
        outcome: {type: string, enum: [PASSED, FAILED, BLOCKED]}
        summary: {type: string, minLength: 1, maxLength: 1000}
        errorCode: {type: string, minLength: 1, maxLength: 128}
        errorCategory: {type: string, enum: [TEST_FAILURE, ENVIRONMENT, EVIDENCE]}
        retryable: {type: boolean}
        userActionRequired: {type: boolean}
        evidence:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/WorkerEvidence'}
    AuthoringActionCompletionRequest:
      type: object
      additionalProperties: false
      required: [workerId, slotId, outcome, summary, pageState, verification]
      properties:
        workerId: {type: string, minLength: 3, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
        slotId: {type: string, minLength: 8, maxLength: 80}
        outcome: {type: string, enum: [VERIFIED_PASSED, FAILED, AMBIGUOUS]}
        summary: {type: string, minLength: 1, maxLength: 1000}
        pageState: {type: object, additionalProperties: true}
        verification:
          type: object
          additionalProperties: false
          required: [dom, url, request, business]
          properties:
            dom: {type: boolean}
            url: {type: boolean}
            request: {type: boolean}
            business: {type: boolean}
    MidsceneCapabilityRequest:
      type: object
      additionalProperties: false
      required: [actionType, viewportCount, attemptCount, failureCount, falseSuccessCount, verificationRef]
      properties:
        actionType: {type: string, enum: [LOCATE, INPUT, TAP, SCROLL]}
        viewportCount: {type: integer, minimum: 0}
        attemptCount: {type: integer, minimum: 0}
        failureCount: {type: integer, minimum: 0}
        falseSuccessCount: {type: integer, minimum: 0}
        verificationRef: {type: string, minLength: 8, maxLength: 256}
  responses:
    Problem:
      description: 受控问题响应
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [errorCode, category, message, retryable, userActionRequired, requestId]
            properties:
              errorCode: {type: string}
              category: {type: string}
              message: {type: string}
              retryable: {type: boolean}
              userActionRequired: {type: boolean}
              requestId: {type: string}
