schemaVersion: 1
name: hengzhun_i6_deterministic_scheduling
displayName: 衡准 I6 确定性调度与人工恢复
purpose: Public-UI reproduction checklist; not a private Coze import format.
runtimeKnowledgeAuthority: COZE_KNOWLEDGE_BASE
inputs:
  - {name: request, type: string, required: true, maxLength: 2000}
  - {name: namespace, type: string, required: true}
state:
  durableKeys: [namespace, caseId, planId, scheduleId, scheduleVersion, incidentId, decisionId]
nodes:
  - {id: start, type: start}
  - {id: knowledge, type: knowledge_retrieval, source: Hengzhun-I6-runtime-rules, query: "{{request}}"}
  - {id: route, type: condition, choices: [create_schedule, get_schedule, disable_schedule, recover_schedule]}
  - {id: create, type: plugin, operationId: schedule_create, when: "route == create_schedule"}
  - {id: get, type: plugin, operationId: schedule_get, when: "route == get_schedule || create exists"}
  - {id: confirm_disable, type: user_confirmation, when: "route == disable_schedule"}
  - {id: disable, type: plugin, operationId: schedule_disable, when: "confirm_disable == APPROVE"}
  - {id: confirm_recovery, type: user_confirmation, when: "route == recover_schedule && get.status == PAUSED_FAILURE"}
  - {id: recover, type: plugin, operationId: decision_submit, when: "confirm_recovery == APPROVE"}
  - {id: verify_recovery, type: plugin, operationId: schedule_get, when: "recover exists"}
  - {id: explain, type: skill, skill: regression-result-explanation}
  - {id: end, type: end}
constraints:
  publicPluginOperations: 14
  scheduledExecutionEngine: PLAYWRIGHT_ONLY
  automaticScheduleRecovery: false
  repositoryKnowledgeFallback: false
  privatePlatformApi: false
