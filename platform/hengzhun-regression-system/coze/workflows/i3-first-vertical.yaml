schemaVersion: 1
name: hengzhun_i3_first_vertical
displayName: 衡准-I3-首个纵向回归闭环
purpose: 公开界面逐节点创建清单；不是 Coze 私有导入格式
runtimeKnowledgeAuthority: COZE_KNOWLEDGE_BASE
inputs:
  - {name: request, type: string, required: true, maxLength: 2000}
  - {name: namespace, type: string, required: true, pattern: "^[a-z0-9][a-z0-9._-]{2,63}$"}
  - {name: credentialAlias, type: string, required: true, secret: false}
state:
  durableKeys: [namespace, caseId, caseVersion, planId, runId, taskId, runVersion, resultArtifactId]
nodes:
  - {id: start, type: start}
  - id: knowledge
    type: knowledge_retrieval
    source: 衡准-I3-门户登录回归知识库
    query: "{{request}}"
    output: [resultSummary, citationRefs]
  - id: normalize
    type: skill
    skill: 自然语言回归需求结构化
    inputs: [request, knowledge.resultSummary]
  - id: create_case
    type: plugin
    operationId: case_create_draft
    inputs: [namespace, normalize.caseDraft, knowledge.resultSummary, knowledge.citationRefs]
  - id: get_case
    type: plugin
    operationId: case_get
    inputs: [namespace, create_case.caseId]
  - id: route
    type: skill
    skill: 执行路线选择
    inputs: [get_case]
  - id: compile_plan
    type: plugin
    operationId: plan_compile
    inputs: [namespace, create_case.caseId, get_case.version, route.executionRoute]
  - id: submit_run
    type: plugin
    operationId: run_submit
    inputs: [namespace, create_case.caseId, get_case.version, compile_plan.planId, credentialAlias]
  - id: poll_task
    type: plugin_loop
    operationId: task_get
    inputs: [namespace, submit_run.taskId]
    until: "status in [SUCCEEDED, FAILED]"
    intervalSeconds: 2
    maximumAttempts: 150
    recovery: reuse_same_namespace_and_taskId
  - id: artifact_metadata
    type: plugin
    operationId: artifact_get_metadata
    when: "poll_task.resultArtifactId != null"
    inputs: [namespace, poll_task.resultArtifactId]
  - id: explain
    type: skill
    skill: 回归结果解释
    inputs: [poll_task, artifact_metadata]
  - id: confirm
    type: user_confirmation
    required: true
    output: [choice, reason, confirmationRef]
  - id: decision
    type: plugin
    operationId: decision_submit
    inputs: [namespace, submit_run.runId, poll_task.runVersion, confirm]
  - {id: end, type: end, inputs: [explain, decision]}
acceptance:
  uniquePluginOperations: 7
  requiresPublicUiCreation: true
  requiresPublishedAgent: true
  requiresRealCallEvidence: true
  currentStatus: DRAFT_CREATED_START_END_ONLY_PLUGIN_UNAVAILABLE
