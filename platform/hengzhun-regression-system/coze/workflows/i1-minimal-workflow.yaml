schemaVersion: 1
name: 衡准-I1-最小工作流
purpose: 公开界面逐节点创建时的配置清单，不是私有导入格式
inputs:
  - {name: input, type: string, required: true, maxLength: 256}
nodes:
  - id: start
    type: start
    outputs: [input]
  - id: llm
    type: llm
    model: 衡准 I1 机械链路模型
    prompt: "仅返回以下输入，不添加事实：{{input}}"
    inputs: [start.input]
    timeoutSeconds: 60
  - id: end
    type: end
    inputs: [llm.output]
edges:
  - [start, llm]
  - [llm, end]
acceptance:
  input: I1_CONFORMANCE_PING
  outputContains: I1_CONFORMANCE_PONG
