name: hengzhun-regression-system

# I1 exposes only synthetic, side-effect-free conformance endpoints. I3 exposes
# the Harness on a loopback-only host port for the local Worker; it does not
# publish banking services or execution data to an external network.
services:
  hengzhun-conformance:
    build:
      context: .
      dockerfile: harness/conformance/Dockerfile
    image: hengzhun/conformance:i1-local
    container_name: hengzhun-conformance
    restart: unless-stopped
    env_file:
      - .data/runtime.env
    environment:
      HOST: 0.0.0.0
      PORT: "18787"
      RESPONSE_BUDGET_BYTES: "4096"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - hengzhun-control

  hengzhun-harness:
    build:
      context: .
      dockerfile: harness/Dockerfile
    image: hengzhun/harness:i2-local
    container_name: hengzhun-harness
    restart: unless-stopped
    env_file:
      - .data/runtime.env
    environment:
      HOST: 0.0.0.0
      PORT: "18788"
      HENGZHUN_PRODUCT_ROOT: /app
    ports:
      - "127.0.0.1:18788:18788"
    volumes:
      - ./.data:/app/.data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hengzhun-control
      - hengzhun-worker-bridge

networks:
  hengzhun-control:
    name: hengzhun-control
    internal: true
  hengzhun-worker-bridge:
    name: hengzhun-worker-bridge
    driver: bridge
