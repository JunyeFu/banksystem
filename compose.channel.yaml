name: mifos-channel
services:
  channel-db:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: bank_channel
      POSTGRES_USER: bank_channel
      POSTGRES_PASSWORD: ${CHANNEL_DB_PASSWORD:?CHANNEL_DB_PASSWORD is required}
    volumes: [channel_pg_data:/var/lib/postgresql]
    networks: [channel_internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bank_channel -d bank_channel']
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports: ['127.0.0.1:18081:8080']
    volumes: ['./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro']
    networks: [channel_front, channel_internal]
    depends_on:
      channel-db: {condition: service_healthy}
      customer-web: {condition: service_started}
  customer-web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes: ['./apps/customer-web:/usr/share/nginx/html:ro']
    networks: [channel_front]
  operations-web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes: ['./apps/operations-web:/usr/share/nginx/html:ro']
    networks: [channel_front]
  channel-service:
    image: local/bank-channel-service@sha256:76c38f4938bc5c9eb76a5c894604d90586f65391c9e0febae91c2475dae226aa
    environment:
      CHANNEL_DB_PASSWORD: ${CHANNEL_DB_PASSWORD:?CHANNEL_DB_PASSWORD is required}
      FINERACT_USERNAME: ${FINERACT_USERNAME:?FINERACT_USERNAME is required}
      FINERACT_PASSWORD: ${FINERACT_PASSWORD:?FINERACT_PASSWORD is required}
      FINERACT_BASE_URL: ${FINERACT_BASE_URL:-http://mifos-isolated-fineract-server-1:8080/fineract-provider}
      BANK_CUSTOMER_ISSUER_URI: ${BANK_CUSTOMER_ISSUER_URI:-http://127.0.0.1:18082/realms/bank-customer}
      BANK_CUSTOMER_JWK_SET_URI: ${BANK_CUSTOMER_JWK_SET_URI:-http://keycloak:8080/realms/bank-customer/protocol/openid-connect/certs}
    networks: [channel_internal, channel_front, mifos_core_internal]
    depends_on:
      channel-db: {condition: service_healthy}
      keycloak: {condition: service_started}
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
    command: ['start-dev', '--http-port=8080', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
    ports: ['127.0.0.1:18082:8080']
    volumes: ['./infra/keycloak/realms:/opt/keycloak/data/import:ro']
    networks: [channel_front]
networks:
  channel_front: {driver: bridge}
  channel_internal: {driver: bridge, internal: true}
  mifos_core_internal:
    name: mifos_isolated_internal
    external: true
volumes:
  channel_pg_data: {}
