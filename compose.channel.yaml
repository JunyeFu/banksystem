name: ${HENGZHUN_CHANNEL_COMPOSE_PROJECT:-mifos-channel}

services:
  bank-channel-postgres:
    restart: unless-stopped
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: bank_channel
      POSTGRES_USER: bank_channel
      POSTGRES_PASSWORD_FILE: /run/secrets/channel_db_password
    volumes:
      - bank_channel_pg_data:/var/lib/postgresql
    networks:
      - bank-channel-net
    secrets:
      - channel_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_channel -d bank_channel"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:19000:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - bank-channel-front
      - bank-channel-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  bank-channel-service:
    restart: unless-stopped
    dns_search: ["."]
    build:
      context: ./services/bank-channel-service
      dockerfile: Dockerfile
    image: local/bank-channel-service:0.1.0
    environment:
      CHANNEL_DB_PASSWORD: ${CHANNEL_DB_PASSWORD:?CHANNEL_DB_PASSWORD is required}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      FINERACT_USERNAME: ${FINERACT_USERNAME:?FINERACT_USERNAME is required}
      FINERACT_PASSWORD: ${FINERACT_PASSWORD:?FINERACT_PASSWORD is required}
      CLEARING_CALLBACK_SECRET: ${CLEARING_CALLBACK_SECRET:?CLEARING_CALLBACK_SECRET is required}
      FINERACT_BASE_URL: ${FINERACT_BASE_URL:-http://fineract-server:8080/fineract-provider}
      FINERACT_TENANT: ${FINERACT_TENANT:-default}
      BANK_CUSTOMER_ISSUER_URI: ${BANK_CUSTOMER_ISSUER_URI:-http://127.0.0.1:19000/realms/bank-customer}
      BANK_CUSTOMER_JWK_SET_URI: ${BANK_CUSTOMER_JWK_SET_URI:-http://keycloak:8080/realms/bank-customer/protocol/openid-connect/certs}
      BANK_INTERNAL_ISSUER_URI: ${BANK_INTERNAL_ISSUER_URI:-http://127.0.0.1:19000/realms/bank-internal}
      BANK_INTERNAL_JWK_SET_URI: ${BANK_INTERNAL_JWK_SET_URI:-http://keycloak:8080/realms/bank-internal/protocol/openid-connect/certs}
      SPRING_PROFILES_ACTIVE: ${BANK_CHANNEL_PROFILES:-demo}
      BANK_FIXTURE_CATALOG_PATH: /app/fixtures/baseline-fixtures.yaml
      APP_LOCALE: ${APP_LOCALE:-zh-CN}
      TZ: Asia/Shanghai
    networks:
      - bank-channel-net
      - mifos-core-net
    volumes:
      - ./contracts/fixtures/baseline-fixtures.yaml:/app/fixtures/baseline-fixtures.yaml:ro
    depends_on:
      bank-channel-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  test-support-service:
    extends:
      service: bank-channel-service
    environment:
      SPRING_PROFILES_ACTIVE: test-support
      SPRING_LIQUIBASE_ENABLED: "false"
    depends_on:
      bank-channel-service:
        condition: service_healthy

  mock-clearing-service:
    profiles: [mock-clearing]
    build:
      context: ./services/mock-clearing-service
      dockerfile: Dockerfile
    image: local/mock-clearing-service:0.1.0
    environment:
      CLEARING_CALLBACK_SECRET: ${CLEARING_CALLBACK_SECRET:?CLEARING_CALLBACK_SECRET is required}
      BANK_CHANNEL_URL: http://bank-channel-service:8080
    networks:
      - bank-channel-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  customer-portal:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/frontend/Dockerfile
      args:
        APP_NAME: customer-portal
    image: local/customer-portal:0.1.0
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./infra/gateway/customer-portal-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bank-channel-front
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/portal/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  operations-console:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/frontend/Dockerfile
      args:
        APP_NAME: operations-console
    image: local/operations-console:0.1.0
    ports:
      - "127.0.0.1:18083:80"
    volumes:
      - ./infra/gateway/operations-console-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bank-channel-front
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ops/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    restart: unless-stopped
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    ports:
      - "127.0.0.1:18443:8080"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bank-channel-front
      - bank-channel-net
    depends_on:
      bank-channel-service:
        condition: service_healthy
      test-support-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.4.2@sha256:3b1d5be5c3eef4f027665ddaa3b1a7de8a58d96a0a6de5dd45629afd267ecaf0
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - bank-channel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    restart: unless-stopped
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:19001:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - bank-channel-front
      - bank-channel-net
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  loki:
    restart: unless-stopped
    image: grafana/loki:3.5.1@sha256:a74594532eec4cc313401beedc4dd2708c43674c032084b1aeb87c14a5be1745
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - bank-channel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.130.0@sha256:867d1074c2f750936fb9358ec9eefa009308053cf156b2c7ca1761ba5ef78452
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    networks:
      - bank-channel-net
    depends_on:
      loki:
        condition: service_started

networks:
  bank-channel-front:
    driver: bridge
  bank-channel-net:
    driver: bridge
    internal: true
  mifos-core-net:
    name: ${HENGZHUN_CORE_INTERNAL_NETWORK:-mifos_isolated_internal}
    external: true

volumes:
  bank_channel_pg_data: {}
  keycloak_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}

secrets:
  channel_db_password:
    file: ./secrets/channel-db-password.txt
